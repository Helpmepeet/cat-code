<meta charset="utf-8">
<title>Goals nav icon choices</title>
<style>
  :root {
    --app-bg: #09090b;
    --text-subtle: #98989f;
    --text-hover: #d4d4d8;
    --accent-soft: #f9a8d4;
    --accent-rgb: 244 114 182;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #050506;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: #e4e4e7;
    padding: 40px;
    overflow-x: auto;
  }

  /* ---- chrome (x- prefixed, never touches specimen pixels) ---- */
  .x-head {
    font: 500 10px/1.4 ui-monospace, Menlo, monospace;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #6b6b70;
    margin: 0 0 28px;
  }
  .x-grid {
    display: grid;
    grid-template-columns: 28px repeat(4, 190px);
    gap: 1px;
    background: #1c1c1f;
    width: max-content;
  }
  .x-cell {
    background: #0d0d0f;
    padding: 14px 16px;
    display: flex;
    align-items: center;
  }
  .x-colhead {
    font: 500 9px/1 ui-monospace, Menlo, monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6b6b70;
  }
  .x-rowlabel {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font: 500 9px/1 ui-monospace, Menlo, monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6b6b70;
    justify-content: center;
  }
  .x-tag {
    font: 500 9px/1 ui-monospace, Menlo, monospace;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #52525b;
    margin-right: 8px;
  }

  /* ---- specimen: exact sidebar nav row, unstyled by chrome ---- */
  .rail-btn {
    display: flex;
    height: 32px;
    width: 32px;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    color: var(--text-subtle);
    background: transparent;
  }
  .rail-btn.active {
    background: rgb(var(--accent-rgb) / 0.09);
    color: var(--accent-soft);
  }
  .row {
    display: flex;
    width: 168px;
    align-items: center;
    gap: 4px;
    border-radius: 6px;
    padding: 6px 6px;
    color: var(--text-subtle);
    background: transparent;
  }
  .row.active {
    background: rgb(var(--accent-rgb) / 0.09);
    color: var(--accent-soft);
  }
  .row .icon-wrap {
    display: flex;
    height: 20px;
    width: 32px;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
  }
  .row .label {
    font-size: 13px;
  }
  .row.active .label {
    font-weight: 500;
  }
  svg.ic { width: 16px; height: 16px; }
</style>
</head>
