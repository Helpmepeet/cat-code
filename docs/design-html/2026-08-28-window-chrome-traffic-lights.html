<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Window chrome — traffic lights</title>
<style>
@font-face{font-family:'DM Sans';font-style:normal;font-weight:100 1000;font-display:block;src:url('../../app/renderer/src/assets/fonts/DMSans-Variable.woff2') format('woff2')}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:block;src:url('../../app/renderer/src/assets/fonts/DMMono-Regular.woff2') format('woff2')}

:root{
  --accent:#f472b6; --accent-soft:#f9a8d4;
  --app-bg:#09090b; --shell-chrome:#070709; --surface-panel:#0a0a0c;
  --shell-seam:rgba(255,255,255,0.06);
  --text-primary:#f4f4f5; --text-muted:#a1a1aa; --text-subtle:#98989f;
  --text-faint:#838389; --text-ghost:#75757b;
  --tone-good:#4ade80;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#2a2a2e;color:#f4f4f5;font-family:var(--sans);-webkit-font-smoothing:antialiased}

/* ---------- chrome (x-) : never inside a specimen ---------- */
.x-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:10px 28px;background:#232326;border-bottom:1px solid rgba(255,255,255,.08)}
.x-name{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#8a8a92}
.x-tabs{display:flex;gap:2px;margin-left:auto}
.x-tab{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#6f6f77;background:none;border:none;border-bottom:1px solid transparent;padding:4px 9px;cursor:pointer}
.x-tab[aria-pressed="true"]{color:#c8c8ce;border-bottom-color:#c8c8ce}
.x-wrap{max-width:1000px;margin:0 auto;padding:0 28px 120px}
.x-sec{padding-top:46px}
.x-sechead{display:flex;align-items:baseline;gap:14px;border-top:1px solid rgba(255,255,255,.12);padding-top:9px;margin-bottom:22px}
.x-id{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#c8c8ce}
.x-note{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#6f6f77}
</style>
</head>
<body>

<div class="x-bar">
  <span class="x-name">Cat Code &middot; window chrome</span>
  <span class="x-tabs">
    <button aria-pressed="true" class="x-tab" data-rail="collapsed" type="button">Rail collapsed</button>
    <button aria-pressed="false" class="x-tab" data-rail="expanded" type="button">Rail expanded</button>
  </span>
</div>

<div class="x-wrap" id="wrap"></div>

<style>
/* ================= specimen: the window and everything the app paints ======== */
.win{position:relative;width:900px;height:340px;border-radius:10px;overflow:hidden;background:var(--app-bg);box-shadow:0 18px 44px rgba(0,0,0,.45)}

/* macOS-drawn title bar (only the current build has one) */
.os-bar{position:absolute;top:0;left:0;right:0;height:28px;background:#1d1d21;border-bottom:1px solid rgba(255,255,255,.07)}
.os-title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-size:13px;font-weight:600;color:rgba(255,255,255,.72)}

/* macOS-drawn traffic lights: 12px, 8px apart */
.tl{position:absolute;z-index:9;display:flex;gap:8px}
.tl i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.tl i:nth-child(1){background:#ff5f57}
.tl i:nth-child(2){background:#febc2e}
.tl i:nth-child(3){background:#28c840}

/* sidebar rail */
.rail{position:absolute;left:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface-panel);border-right:1px solid rgba(255,255,255,.05)}
.rail.exp{width:240px;box-shadow:4px 0 24px rgba(0,0,0,.45);z-index:4}
.rail-head{position:relative;display:flex;height:50px;flex-shrink:0;align-items:center;justify-content:center}
.rail.exp .rail-head{justify-content:space-between;padding-left:16px;padding-right:10px}
.rail-brand{display:flex;min-width:0;align-items:center;gap:10px}
.paw{display:flex;color:var(--accent)}
.rail-name{font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--text-primary)}
.rail-headbtns{display:flex;align-items:center;gap:4px}
.rail-headbtn{display:flex;height:22px;width:22px;align-items:center;justify-content:center;border-radius:4px;color:var(--text-faint)}
.rail-headbtn.on{background:rgba(244,114,182,.12);color:var(--accent)}
.rail-search{flex-shrink:0;padding:0 10px 8px;position:relative}
.rail-search span{position:absolute;left:18px;top:13px;display:flex;color:var(--text-faint)}
.rail-search input{width:100%;border-radius:8px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);padding:6px 8px 6px 26px;font-family:var(--sans);font-size:12px;color:#d4d4d8;outline:none}
.rail-search input::placeholder{color:var(--text-subtle)}
.rail-new{display:flex;flex-shrink:0;align-items:center;gap:9px;margin:0 8px 8px;border-radius:6px;padding:6px 8px;font-size:12.5px;font-weight:500;color:#d4d4d8;background:none;border:none;font-family:var(--sans)}
.rail-sec{padding:2px 12px 6px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.rail-nav{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 12px}
.rail-navbtn{display:flex;height:32px;width:32px;align-items:center;justify-content:center;border-radius:6px;color:var(--text-subtle)}
.rail-navbtn.on{background:rgba(244,114,182,.12);color:var(--accent-soft)}
.rail-foot{margin-top:auto;display:flex;flex-shrink:0;align-items:center;border-top:1px solid var(--shell-seam);padding:6px 8px 8px}
.rail-foot span{margin-left:auto;display:flex;height:26px;width:26px;align-items:center;justify-content:center;border-radius:6px;color:var(--text-faint)}

/* tab bar */
.bar{position:absolute;display:flex;height:40px;align-items:stretch;overflow:hidden;background:var(--shell-chrome);border-bottom:1px solid var(--shell-seam)}
.bar-tool{display:flex;flex-shrink:0;align-items:center;padding-right:10px}
.bar-tool span{display:flex;height:26px;width:26px;align-items:center;justify-content:center;border-radius:6px;color:var(--text-faint)}
.bar-tabs{display:flex;flex:1;align-items:stretch;overflow:hidden}
.tab{position:relative;display:flex;min-width:90px;max-width:176px;flex:1 1 auto;align-items:center;gap:6px;border-right:1px solid rgba(255,255,255,.05);padding-left:12px;padding-right:6px}
.tab.on{background:rgba(255,255,255,.05)}
.tab-underline{position:absolute;left:0;right:0;bottom:0;height:1.5px;border-radius:2px 2px 0 0;background:var(--accent)}
.dot{height:6px;width:6px;flex-shrink:0;border-radius:50%}
.dot.live{background:var(--tone-good)}
.dot.busy{background:var(--accent)}
.tab-title{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text-subtle)}
.tab.on .tab-title{color:var(--text-primary)}
.tab-more{display:flex;height:18px;width:18px;flex-shrink:0;align-items:center;justify-content:center;border-radius:4px;color:rgba(152,152,159,.7)}
.bar-add{display:flex;width:40px;flex-shrink:0;align-items:center;justify-content:center;font-size:20px;line-height:1;color:var(--text-ghost);background:none;border:none;font-family:var(--sans)}
.bar-split{display:flex;flex-shrink:0;align-items:center;gap:4px;border-left:1px solid var(--shell-seam);padding:0 10px}
.split-btn{display:flex;align-items:center;gap:6px;border-radius:6px;border:1px solid rgba(255,255,255,.08);padding:3px 10px;font-family:var(--sans);font-size:11px;color:var(--text-faint);background:none}

/* the ground the transcript sits on */
.ground{position:absolute;background:var(--app-bg)}
</style>

<script>
const S = (d, w) => '<svg width="'+(w||16)+'" height="'+(w||16)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>'
const NAV = [
  ['chat', S('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>')],
  ['sessions', S('<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>')],
  ['goals', S('<circle cx="12" cy="12" r="8.5"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>')],
  ['accounts', S('<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>')],
  ['settings', S('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>')],
]
const PAW = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><ellipse cx="6.5" cy="5.5" rx="1.8" ry="2.5" opacity=".65"/><ellipse cx="11.5" cy="4" rx="1.8" ry="2.5" opacity=".65"/><ellipse cx="16.5" cy="5.5" rx="1.8" ry="2.5" opacity=".65"/><ellipse cx="4" cy="9.5" rx="1.4" ry="2" opacity=".45"/><path d="M12 21.5c-4.2 0-7.5-2.3-7.5-6 0-1.9 1.1-3.6 2.8-4.6.75-.45 1.6-.65 2.3-.65h.8c.7 0 1.55.2 2.3.65 1.7.95 2.8 2.7 2.8 4.6 0 3.7-3.3 6-7.5 6z"/></svg>'
const COLLAPSE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 7-5 5 5 5"/><path d="M20 5v14"/></svg>'
const EXPAND_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 7 5 5-5 5"/><path d="M4 5v14"/></svg>'
const PIN_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1V4H8v2h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24z"/></svg>'
const SEARCH_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'
const COMPOSE_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>'
const MORE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>'
const GRID_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>'
const SPLIT_ICON = '<svg width="15" height="11" viewBox="0 0 15 11" fill="none" aria-hidden="true"><rect x="0" y="0" width="6.5" height="11" rx="1.5" fill="currentColor" opacity="0.45"/><rect x="8.5" y="0" width="6.5" height="11" rx="1.5" fill="currentColor" opacity="1"/></svg>'

const TABS = [
  { title: 'cat-code', tone: 'live', on: true },
  { title: 'notes', tone: 'busy', on: false },
  { title: 'scratch', tone: 'live', on: false },
]

function tabBar (geo) {
  const tabs = TABS.map(t => (
    '<div class="tab' + (t.on ? ' on' : '') + '">' +
      (t.on ? '<span class="tab-underline"></span>' : '') +
      '<span class="dot ' + t.tone + '"></span>' +
      '<span class="tab-title">' + t.title + '</span>' +
      (t.on ? '<span class="tab-more">' + MORE_ICON + '</span>' : '') +
    '</div>'
  )).join('')
  return '<div class="bar" style="top:' + geo.barTop + 'px;left:' + geo.barLeft + 'px;right:0">' +
    (geo.well ? '<div style="width:' + geo.well + 'px;flex-shrink:0"></div>' : '') +
    (geo.barTool ? '<div class="bar-tool"><span>' + EXPAND_ICON + '</span></div>' : '') +
    '<div class="bar-tabs">' + tabs + '<button class="bar-add" type="button">+</button></div>' +
    '<div class="bar-split"><span class="split-btn">' + SPLIT_ICON + '<span>Split</span></span></div>' +
  '</div>'
}

function rail (geo, expanded) {
  const nav = NAV.map(([id, icon], i) =>
    '<span class="rail-navbtn' + (i === 0 ? ' on' : '') + '">' + icon + '</span>').join('')

  // The head exists only where something occupies it: the current build's paw,
  // an expanded panel's wordmark, or a light well the rail itself owns.
  const headStyle = expanded && geo.expHeadInset
    ? ' style="padding-left:' + geo.expHeadInset + 'px"'
    : ''
  const head = (expanded || geo.paw || geo.railWell)
    ? '<div class="rail-head"' + headStyle + '>' +
        '<div class="rail-brand">' +
          (geo.paw ? '<span class="paw">' + PAW + '</span>' : '') +
          (expanded ? '<span class="rail-name">Cat Code</span>' : '') +
        '</div>' +
        (expanded && !geo.barTool
          ? '<div class="rail-headbtns"><span class="rail-headbtn">' + COLLAPSE_ICON + '</span>' +
            '<span class="rail-headbtn on">' + PIN_ICON + '</span></div>'
          : '') +
      '</div>'
    : ''

  const body = expanded
    ? '<div class="rail-search"><span>' + SEARCH_ICON + '</span>' +
        '<input type="text" placeholder="Search sessions…" readonly></div>' +
      '<button class="rail-new" type="button">' + COMPOSE_ICON + '<span>New chat</span></button>' +
      '<div class="rail-sec">Pinned</div><div style="flex:1"></div>'
    : ''
  const foot = expanded
    ? '<div class="rail-foot"><span>' + GRID_ICON + '</span></div>'
    : '<nav class="rail-nav">' + nav + '</nav>'

  return '<div class="rail' + (expanded ? ' exp' : '') + '" style="top:' + geo.railTop + 'px;bottom:0;' +
      (expanded ? '' : 'width:' + geo.railWidth + 'px;') + '">' +
      (expanded && geo.expHeadPad
        ? '<div style="height:' + geo.expHeadPad + 'px;flex-shrink:0"></div>' : '') +
      head + body + foot +
    '</div>'
}

function win (geo, expanded) {
  return '<div class="win">' +
    (geo.osBar ? '<div class="os-bar"><div class="os-title">Cat Code Dev</div></div>' : '') +
    '<div class="ground" style="top:' + (geo.barTop + 40) + 'px;left:' + geo.groundLeft + 'px;right:0;bottom:0"></div>' +
    tabBar(geo) + rail(geo, expanded) +
    '<div class="tl" style="left:' + geo.lightX + 'px;top:' + geo.lightY + 'px"><i></i><i></i><i></i></div>' +
  '</div>'
}

const VARIANTS = [
  { id: 'CURRENT', note: 'macOS title bar',
    geo: { osBar: true, lightX: 13, lightY: 8, barTop: 28, barLeft: 48, well: 0,
           railTop: 28, railWidth: 48, groundLeft: 48, paw: true } },

  { id: 'A', note: 'Tab strip as the title bar',
    geo: { osBar: false, lightX: 20, lightY: 14, barTop: 0, barLeft: 0, well: 84,
           railTop: 40, railWidth: 48, groundLeft: 48 } },

  { id: 'B', note: 'Rail control beside the lights',
    geo: { osBar: false, lightX: 20, lightY: 14, barTop: 0, barLeft: 0, well: 80,
           barTool: true, railTop: 40, railWidth: 48, groundLeft: 48 } },

  { id: 'C', note: 'Rail as the title column',
    geo: { osBar: false, lightX: 13, lightY: 14, barTop: 0, barLeft: 76, well: 0,
           railTop: 0, railWidth: 76, groundLeft: 76, railWell: true, expHeadInset: 78 } },

  { id: 'D', note: 'Well shared across the seam',
    geo: { osBar: false, lightX: 13, lightY: 14, barTop: 0, barLeft: 48, well: 30,
           railTop: 0, railWidth: 48, groundLeft: 48, railWell: true, expHeadInset: 78 } },
]

let railState = 'collapsed'
function render () {
  const expanded = railState === 'expanded'
  document.getElementById('wrap').innerHTML = VARIANTS.map(v =>
    '<section class="x-sec"><div class="x-sechead">' +
      '<span class="x-id">' + v.id + '</span><span class="x-note">' + v.note + '</span>' +
    '</div>' + win(v.geo, expanded) + '</section>').join('')
}
document.querySelectorAll('.x-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    railState = btn.dataset.rail
    document.querySelectorAll('.x-tab').forEach(b =>
      b.setAttribute('aria-pressed', String(b === btn)))
    render()
  })
})
render()
</script>
</body>
</html>
