<html lang="en">
<head>
<meta charset="utf-8">
<title>AskUserQuestion redesign</title>
<style>
@font-face{font-family:'DM Sans';font-style:normal;font-weight:100 1000;font-display:block;src:url('../../app/renderer/src/assets/fonts/DMSans-Variable.woff2') format('woff2')}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:block;src:url('../../app/renderer/src/assets/fonts/DMMono-Regular.woff2') format('woff2')}

:root{
  --accent:#f472b6; --accent-soft:#f9a8d4; --app-bg:#09090b;
  --text-primary:#f4f4f5; --text-muted:#a1a1aa; --text-subtle:#98989f;
  --text-faint:#838389; --text-ghost:#75757b;
  --tone-info:#60a5fa; --seam:rgba(255,255,255,0.06);

  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;

*{box-sizing:border-box}
html,body{margin:0;background:var(--app-bg);color:var(--text-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased}

/* ---------- chrome (x-) : never inside a specimen ---------- */
.x-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:10px 28px;background:#09090b;border-bottom:1px solid rgba(255,255,255,.08)}
.x-name{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#5f5f66}
.x-tabs{display:flex;gap:2px;margin-left:auto}
.x-tab{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#5f5f66;background:none;border:none;border-bottom:1px solid transparent;padding:4px 9px;cursor:pointer}
.x-tab[aria-pressed="true"]{color:#b4b4bb;border-bottom-color:#b4b4bb}
.x-wrap{max-width:1360px;margin:0 auto;padding:0 28px 120px}
.x-sec{padding-top:44px}
.x-sechead{display:flex;align-items:baseline;gap:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:9px;margin-bottom:26px}
.x-id{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#8a8a92}
.x-note{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#5f5f66}
.x-pose{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#5f5f66;margin:0 0 9px}
.x-slot{margin-bottom:34px}
.x-stage{width:900px}
</style>
</head>

<script>
var Q1 = {
  header: 'Auth method',
  question: 'Which authentication approach should the new endpoint use?',
  options: [
    { label: 'Session cookie', desc: 'Reuse the signed cookie and CSRF token the web app already sends.' },
    { label: 'Bearer token', desc: 'Issue a short-lived token at login and send it in the header.',
      preview: 'Authorization: Bearer <token>\nexpires_in: 900\nrefresh:    rotating' },
    { label: 'Both', desc: 'Cookie for the browser, token for the command line.' }
  ]
};
var Q2 = {
  header: 'Coverage',
  question: 'Which surfaces should this change cover?',
  options: [
    { label: 'Renderer', desc: 'The window and its components.' },
    { label: 'Sidecar', desc: 'The engine process behind the socket.' },
    { label: 'Host API', desc: 'The typed control plane.' },
    { label: 'Docs', desc: 'Maps and the migration status file.' }
  ]
};
var OTHER_TEXT = 'Only the preload allowlist';

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

/* ---------------- CURRENT ---------------- */
function current(pose) {
  var root = el('section', 'cur');
  root.appendChild(curBody(pose));
  return root;
}

function curBody(pose) {
  var multi = pose === 2, q = multi ? Q2 : Q1;
  var root = document.createDocumentFragment();
  var head = el('div', 'cur-head');
  head.appendChild(el('span', 'cur-chip', q.header));
  if (multi) head.appendChild(el('span', 'cur-multi', 'multi-select'));
  if (multi) {
    var st = el('span', 'cur-step');
    ['done', 'on', ''].forEach(function (k) { st.appendChild(el('span', 'cur-dot ' + k)); });
    st.appendChild(el('span', 'cur-cnt', '2/3'));
    head.appendChild(st);
  }
  root.appendChild(head);
  root.appendChild(el('h2', 'cur-q', q.question));

  var list = el('div', 'cur-list');
  q.options.forEach(function (o, i) {
    var sel = multi ? (i < 2) : (i === 0);
    var foc = !multi && i === 1;
    var row = el('button', 'cur-row' + (foc ? ' f' : sel ? ' s' : ''));
    row.type = 'button';
    row.appendChild(el('span', 'cur-mk' + (multi ? ' sq' : '') + (sel ? ' s' : foc ? ' f' : ''), sel ? '✓' : String(i + 1)));
    var b = el('span', 'cur-body');
    b.appendChild(el('span', 'cur-lb', o.label));
    if (o.desc) b.appendChild(el('span', 'cur-ds', o.desc));
    row.appendChild(b);
    if (o.preview) row.appendChild(el('span', 'cur-pv', 'preview'));
    list.appendChild(row);
  });
  var orow = el('div', 'cur-other' + (multi ? ' f' : ''));
  orow.appendChild(el('span', 'cur-mk' + (multi ? ' sq' : '') + (multi ? ' f' : ''), String(q.options.length + 1)));
  orow.appendChild(el('span', 'cur-in' + (multi ? '' : ' ph'), multi ? OTHER_TEXT : 'Other…'));
  list.appendChild(orow);
  root.appendChild(list);

  if (!multi) {
    var pv = el('div', 'cur-prev');
    pv.appendChild(el('div', 'cur-prev-t', 'Preview'));
    pv.appendChild(el('pre', 'cur-prev-b', Q1.options[1].preview));
    root.appendChild(pv);
  }

  var foot = el('div', 'cur-foot');
  var go = el('button', 'cur-go');
  go.type = 'button';
  go.appendChild(document.createTextNode(multi ? 'Next question' : 'Submit'));
  go.appendChild(el('span', 'cur-kb', '↵'));
  foot.appendChild(go);
  var shortcut = q.options.length < 9 ? '1–' + (q.options.length + 1) : '1–9 · o';
  foot.appendChild(el('span', 'cur-hint', multi ? shortcut + ' / space toggle · ↑↓ move' : shortcut + ' pick · ↑↓ move'));
  var cx = el('button', 'cur-cancel');
  cx.type = 'button';
  cx.appendChild(document.createTextNode('Cancel'));
  cx.appendChild(el('span', 'cur-kb2', 'esc'));
  foot.appendChild(cx);
  root.appendChild(foot);
  return root;
}

/* ---------------- shared bits for A / C ---------------- */
function vHead(q, multi) {
  var k = el('div', 'v-kick');
  k.appendChild(el('span', 'v-kick-l', q.header));
  if (multi) k.appendChild(el('span', 'v-pill', 'Choose any'));
  if (multi) {
    var st = el('span', 'v-step');
    ['done', 'on', ''].forEach(function (c) { st.appendChild(el('span', 'v-sd ' + c)); });
    st.appendChild(el('span', 'v-sc', '2/3'));
    k.appendChild(st);
  }
  return k;
}
function vList(q, multi) {
  var list = el('div', 'v-list');
  q.options.forEach(function (o, i) {
    var sel = multi ? (i < 2) : (i === 0);
    var foc = !multi && i === 1;
    var row = el('button', 'v-row' + (sel ? ' s' : '') + (foc ? ' f' : ''));
    row.type = 'button';
    row.appendChild(el('span', 'v-mk' + (multi ? ' sq' : '') + (sel ? ' on' : ''), '✓'));
    var b = el('span', 'v-body');
    b.appendChild(el('span', 'v-lb', o.label));
    if (o.desc) b.appendChild(el('span', 'v-ds', o.desc));
    row.appendChild(b);
    var r = el('span', 'v-right');
    if (o.preview) r.appendChild(el('span', 'v-eye', 'preview'));
    r.appendChild(el('span', 'v-key', String(i + 1)));
    row.appendChild(r);
    list.appendChild(row);
  });
  var orow = el('div', 'v-orow' + (multi ? ' f' : ''));
  orow.appendChild(el('span', 'v-omk'));
  var ot = el('span', 'v-otext' + (multi ? '' : ' ph'));
  ot.appendChild(document.createTextNode(multi ? OTHER_TEXT : 'Other answer'));
  if (multi) ot.appendChild(el('span', 'v-caret'));
  orow.appendChild(ot);
  var orr = el('span', 'v-right');
  orr.appendChild(el('span', 'v-key', String(q.options.length + 1)));
  orow.appendChild(orr);
  list.appendChild(orow);
  return list;
}
function vPreview() {
  var pv = el('div', 'v-prev');
  var h = el('div', 'v-prev-h');
  h.appendChild(el('span', 'v-prev-k', 'Preview'));
  h.appendChild(el('span', 'v-prev-n', Q1.options[1].label));
  pv.appendChild(h);
  pv.appendChild(el('pre', 'v-prev-b', Q1.options[1].preview));
  return pv;
}
function vFoot(multi) {
  var foot = el('div', 'v-foot');
  var go = el('button', 'v-go');
  go.type = 'button';
  go.appendChild(document.createTextNode(multi ? 'Next question' : 'Submit answer'));
  go.appendChild(el('span', 'v-gokb', '↵'));
  foot.appendChild(go);
  var cx = el('button', 'v-cancel');
  cx.type = 'button';
  cx.appendChild(document.createTextNode('Cancel'));
  cx.appendChild(el('span', 'v-cankb', 'esc'));
  foot.appendChild(cx);
  foot.appendChild(el('span', 'v-hint', multi ? 'space toggle · ↑↓ move' : '↑↓ move'));
  return foot;
}

/* ---------------- A ---------------- */
function variantA(pose) {
  var multi = pose === 2, q = multi ? Q2 : Q1;
  var root = el('section', 'v-card');
  root.appendChild(vHead(q, multi));
  root.appendChild(el('h2', 'v-q', q.question));
  root.appendChild(vList(q, multi));
  if (!multi) root.appendChild(vPreview());
  root.appendChild(vFoot(multi));
  return root;
}

/* ---------------- C ---------------- */
function variantC(pose) {
  var multi = pose === 2, q = multi ? Q2 : Q1;
  var root = el('section', 'v-card');
  root.appendChild(vHead(q, multi));
  root.appendChild(el('h2', 'v-q', q.question));
  if (multi) {
    root.appendChild(vList(q, multi));
  } else {
    var split = el('div', 'c-split');
    split.appendChild(vList(q, multi));
    split.appendChild(vPreview());
    root.appendChild(split);
  }
  root.appendChild(vFoot(multi));
  return root;
}

/* ---------------- B ---------------- */
function variantB(pose) {
  var multi = pose === 2, q = multi ? Q2 : Q1;
  var root = el('section', 'b-card');
  var k = el('div', 'b-kick');
  k.appendChild(el('span', 'b-kick-l', q.header));
  if (multi) k.appendChild(el('span', 'b-pill', 'Choose any'));
  if (multi) {
    var st = el('span', 'b-step');
    ['done', 'on', ''].forEach(function (c) { st.appendChild(el('span', 'b-sd ' + c)); });
    st.appendChild(el('span', 'b-sc', '2/3'));
    k.appendChild(st);
  }
  root.appendChild(k);
  root.appendChild(el('h2', 'b-q', q.question));

  var list = el('div', 'b-list');
  q.options.forEach(function (o, i) {
    var sel = multi ? (i < 2) : (i === 0);
    var foc = !multi && i === 1;
    var row = el('button', 'b-row' + (sel ? ' s' : '') + (foc ? ' f' : ''));
    row.type = 'button';
    row.appendChild(el('span', 'b-mk' + (multi ? ' sq' : '') + (sel ? ' on' : ''), '✓'));
    var b = el('span', 'b-body');
    b.appendChild(el('span', 'b-lb', o.label));
    if (o.desc) b.appendChild(el('span', 'b-ds', o.desc));
    row.appendChild(b);
    var r = el('span', 'b-right');
    if (o.preview) r.appendChild(el('span', 'b-eye', 'preview'));
    r.appendChild(el('span', 'b-key', String(i + 1)));
    row.appendChild(r);
    list.appendChild(row);
    if (foc && o.preview) {
      var pv = el('div', 'b-prev');
      pv.appendChild(el('div', 'b-prev-k', 'Preview'));
      pv.appendChild(el('pre', 'b-prev-b', o.preview));
      list.appendChild(pv);
    }
  });
  var orow = el('div', 'b-orow' + (multi ? ' f' : ''));
  orow.appendChild(el('span', 'b-omk', '›'));
  var ot = el('span', 'b-otext' + (multi ? '' : ' ph'));
  ot.appendChild(document.createTextNode(multi ? OTHER_TEXT : 'Other answer'));
  if (multi) ot.appendChild(el('span', 'v-caret'));
  orow.appendChild(ot);
  var orr = el('span', 'b-right');
  orr.appendChild(el('span', 'b-key', String(q.options.length + 1)));
  orow.appendChild(orr);
  list.appendChild(orow);
  root.appendChild(list);

  var foot = el('div', 'b-foot');
  var go = el('button', 'b-go');
  go.type = 'button';
  go.appendChild(document.createTextNode(multi ? 'Next question' : 'Submit answer'));
  go.appendChild(el('span', 'b-gokb', '↵'));
  foot.appendChild(go);
  var cx = el('button', 'b-cancel');
  cx.type = 'button';
  cx.appendChild(document.createTextNode('Cancel'));
  cx.appendChild(el('span', 'b-cankb', 'esc'));
  foot.appendChild(cx);
  foot.appendChild(el('span', 'b-hint', multi ? 'space toggle · ↑↓ move' : '↑↓ move'));
  root.appendChild(foot);
  return root;
}

/* ---------------- D — prototype host restored, current internals ---------------- */
var QUESTION_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
  + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/>'
  + '<path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';

function variantD(pose) {
  var multi = pose === 2;
  var root = el('section', 'd-card');
  var body = el('div', 'd-body');
  var kick = el('div', 'd-kick');
  var ico = el('span', 'd-ico');
  ico.innerHTML = QUESTION_ICON;
  kick.appendChild(ico);
  kick.appendChild(el('span', 'd-kick-l', 'Question'));
  if (multi) {
    var pend = el('span', 'd-pend');
    pend.appendChild(el('b', null, '2'));
    pend.appendChild(document.createTextNode(' pending'));
    kick.appendChild(pend);
  }
  body.appendChild(kick);
  body.appendChild(curBody(pose));
  root.appendChild(body);
  var strip = el('div', 'd-strip');
  strip.appendChild(el('span', null, '↑↓ · 1–9 · ↵ · esc'));
  var right = el('div', 'd-strip-r');
  var mr = el('button', 'd-link', 'Manage rules →');
  mr.type = 'button';
  right.appendChild(mr);
  var kp = el('button', 'd-link', 'Keep pending →');
  kp.type = 'button';
  right.appendChild(kp);
  strip.appendChild(right);
  root.appendChild(strip);
  return root;
}

var SECTIONS = [
  { id: 'cur', label: 'Current', note: 'shipped', build: current },
  { id: 'd', label: 'D', note: 'prototype host', build: variantD },
  { id: 'a', label: 'A', note: 'framed rows', build: variantA },
  { id: 'b', label: 'B', note: 'quiet rules', build: variantB },
  { id: 'c', label: 'C', note: 'split canvas', build: variantC }
];
var POSES = [
  { n: 1, label: 'Single select · one chosen · one focused · preview' },
  { n: 2, label: 'Multi select · two chosen · other active · step 2 of 3' }
];

var wrap = document.getElementById('wrap');
SECTIONS.forEach(function (s) {
  var sec = el('section', 'x-sec');
  sec.setAttribute('data-sec', s.id);
  var h = el('div', 'x-sechead');
  h.appendChild(el('span', 'x-id', s.label));
  h.appendChild(el('span', 'x-note', s.note));
  sec.appendChild(h);
  POSES.forEach(function (p) {
    var slot = el('div', 'x-slot');
    slot.appendChild(el('div', 'x-pose', p.label));
    var stage = el('div', 'x-stage');
    stage.appendChild(s.build(p.n));
    slot.appendChild(stage);
    sec.appendChild(slot);
  });
  wrap.appendChild(sec);
});

var tabs = document.querySelectorAll('.x-tab');
Array.prototype.forEach.call(tabs, function (t) {
  t.addEventListener('click', function () {
    var f = t.getAttribute('data-f');
    Array.prototype.forEach.call(tabs, function (o) {
      o.setAttribute('aria-pressed', String(o === t));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sec]'), function (sec) {
      sec.style.display = (f === 'all' || sec.getAttribute('data-sec') === f) ? '' : 'none';
    });
  });
});
</script>
</body>
