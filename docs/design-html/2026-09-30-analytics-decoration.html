<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics Decoration</title>
<style>
@font-face{font-family:"DM Sans";src:url("../../app/renderer/src/assets/fonts/DMSans-Variable.woff2") format("woff2");font-weight:100 1000;font-style:normal}
@font-face{font-family:"DM Mono";src:url("../../app/renderer/src/assets/fonts/DMMono-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"DM Mono";src:url("../../app/renderer/src/assets/fonts/DMMono-Medium.woff2") format("woff2");font-weight:500}

/* ================= CHROME (x-) : not the app ================= */
html,body{margin:0;height:100%}
body{background:#e4e4e6;overflow:hidden}
.x-bar{position:fixed;inset:0 0 auto 0;height:38px;display:flex;align-items:center;gap:22px;padding:0 16px;background:#f3f3f4;border-bottom:1px solid #cdcdd1;font:10px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#77777c;z-index:10}
.x-bar button{all:unset;cursor:pointer;padding:12px 0 10px;border-bottom:1px solid transparent;color:#77777c}
.x-bar button:hover{color:#333}
.x-bar button[aria-pressed=true]{color:#1b1b1d;border-bottom-color:#1b1b1d}
.x-bar button:disabled{opacity:.35;cursor:default}
.x-bar button:focus-visible{outline:1px dashed #555;outline-offset:2px}
.x-sep{flex:1}
.x-id{color:#a0a0a5}
.x-notes{position:fixed;top:39px;right:0;bottom:0;width:280px;padding:16px 18px;background:#f3f3f4;border-left:1px solid #cdcdd1;font:10px/1.7 ui-monospace,Menlo,monospace;color:#5d5d62;z-index:9;overflow:auto;letter-spacing:.02em}
.x-notes[hidden]{display:none}
.x-notes h4{margin:0 0 6px;font:inherit;text-transform:uppercase;letter-spacing:.12em;color:#1b1b1d}
.x-notes h5{margin:14px 0 4px;font:inherit;text-transform:uppercase;letter-spacing:.12em;color:#9a9aa0}
.x-notes ul{margin:0;padding-left:14px}
.x-stage{position:fixed;inset:39px 0 0 0;padding:14px}
.x-stage.x-notes-open{right:280px}

/* ================= SPECIMEN: desktop + window frame ================= */
.desk{position:absolute;inset:0;background:
  radial-gradient(60% 40% at 32% 0%,#6d5a3a 0%,transparent 70%),
  radial-gradient(40% 35% at 78% 6%,#4a4a36 0%,transparent 70%),
  radial-gradient(50% 60% at 95% 70%,#26343a 0%,transparent 70%),
  radial-gradient(45% 55% at 0% 80%,#2c3530 0%,transparent 70%),
  linear-gradient(#2a2a26,#16181a)}
.desk.light{background:
  radial-gradient(60% 40% at 32% 0%,#e9d8b8 0%,transparent 70%),
  radial-gradient(40% 35% at 78% 6%,#dfe2cf 0%,transparent 70%),
  radial-gradient(50% 60% at 95% 70%,#c9d9df 0%,transparent 70%),
  radial-gradient(45% 55% at 0% 80%,#d3dcd5 0%,transparent 70%),
  linear-gradient(#ecebe6,#dcdedf)}
.win{position:relative;height:100%;display:flex;flex-direction:column;border-radius:11px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.7),inset 0 0 0 .5px rgba(255,255,255,.12);
  font-family:var(--font-sans);color:var(--color-text-primary);font-size:14px;-webkit-font-smoothing:antialiased;
  background:var(--glass-tint);backdrop-filter:blur(40px) saturate(1.4);-webkit-backdrop-filter:blur(40px) saturate(1.4);
  --font-sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --font-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.win[data-theme=dark]{color-scheme:dark;--color-app-bg:#09090b;--color-shell-chrome:#070709;--color-surface-raised:#111113;--color-surface-panel:#0a0a0c;--color-shell-seam:rgba(255,255,255,.06);--color-shell-hover:rgba(255,255,255,.045);--color-text-primary:#f4f4f5;--color-text-muted:#a1a1aa;--color-text-subtle:#98989f;--color-accent:#f472b6;--color-accent-soft:#f9a8d4;--color-tone-danger:#f87171;--glass-tint:rgba(24,24,26,.62)}
.win[data-theme=light]{color-scheme:light;--color-app-bg:#fcfcfd;--color-shell-chrome:#f1f1f4;--color-surface-raised:#ffffff;--color-surface-panel:#f7f7f9;--color-shell-seam:rgba(9,9,11,.1);--color-shell-hover:rgba(9,9,11,.04);--color-text-primary:#18181b;--color-text-muted:#52525b;--color-text-subtle:#575761;--color-accent:#bb3e84;--color-accent-soft:#ad3078;--color-tone-danger:#dc2626;--glass-tint:rgba(246,246,248,.66)}
.win button{background:transparent;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;margin:0}
.win *,.win *::before,.win *::after{box-sizing:border-box}
.win-tabs{flex:none;height:42px;display:flex;align-items:stretch;border-bottom:1px solid var(--color-shell-seam);font-size:12.5px;color:var(--color-text-muted)}
.lights{display:flex;gap:8px;align-items:center;padding:0 18px 0 14px;width:84px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.wtab{position:relative;display:flex;align-items:center;gap:8px;width:176px;padding:0 12px;border-right:1px solid var(--color-shell-seam);white-space:nowrap}
.wtab.on{color:var(--color-text-primary);background:var(--color-shell-hover)}
.wtab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--color-accent)}
.wtab .dot{width:6px;height:6px;border-radius:50%;background:#4ade80}
.wtab .dot.p{background:var(--color-accent)}
.wtab .kb{margin-left:auto;color:var(--color-text-subtle)}
.wplus{display:flex;align-items:center;padding:0 14px;font-size:16px;color:var(--color-text-subtle)}
.wsplit{margin:8px 10px 8px auto;display:flex;align-items:center;gap:6px;padding:0 9px;border:1px solid var(--color-shell-seam);border-radius:6px;font-size:11px;color:var(--color-text-subtle)}
.wsplit i{width:12px;height:9px;border:1.3px solid currentColor;border-radius:2px;background:linear-gradient(90deg,currentColor 0 45%,transparent 45%)}
.win-body{flex:1;min-height:0;display:flex;position:relative}
.win-rail{flex:none;width:48px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px;padding:12px 0 14px;border-right:1px solid var(--color-shell-seam);color:var(--color-text-subtle)}
.win-rail span{width:30px;height:30px;display:grid;place-items:center;border-radius:7px}
.win-rail span.on{color:var(--color-accent);background:color-mix(in srgb,var(--color-accent) 14%,transparent)}
.win-rail svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.win-rail .av{width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--color-accent) 25%,transparent);color:var(--color-accent);font-size:10px;font-weight:600}

/* ================= APP CSS (source: usageDashboard.css + siblings) ================= */
.usage-page{overflow:auto;flex:1;min-width:0;padding:24px 28px 52px;background:transparent;color:var(--color-text-primary);position:relative}
.usage-content{max-width:1180px;margin:auto;
  --usage-panel:var(--color-surface-raised);--usage-muted:var(--color-text-subtle);--usage-grid:var(--color-shell-seam);--usage-secondary:var(--color-text-muted);
  --usage-blue:light-dark(#2563eb,#60a5fa);--usage-teal:light-dark(#087f75,#40c4aa);--usage-amber:light-dark(#d97706,#fbbf24);--usage-coral:light-dark(#dc2626,#f87171);--usage-violet:light-dark(#7c3aed,#a78bfa);--usage-cyan:light-dark(#0284c7,#38bdf8);--usage-emerald:light-dark(#16a34a,#34d399);--usage-pink:light-dark(#db2777,#f472b6);--usage-other:light-dark(#64748b,#94a3b8);
  --usage-model-purple:light-dark(#b9a3de,#c4b5fd);--usage-model-blue:light-dark(#85b8d6,#5eead4);--usage-model-orange:light-dark(#dfb29a,#fdba74);--usage-model-yellow:light-dark(#b8ca97,#bef264);--usage-model-pink:light-dark(#acbaca,#cbd5e1);
  --usage-tokens:var(--usage-blue);--usage-cache:light-dark(#c4b5fd,#4c3d7a);--usage-requests:var(--usage-amber);--usage-errors:var(--usage-coral);--usage-sessions:var(--usage-violet);--usage-output:light-dark(#dda2bf,#f472b6);--usage-fresh:light-dark(#8fb8e8,#60a5fa);--usage-writes:var(--usage-amber);--usage-success:var(--usage-emerald);--usage-selection:var(--color-accent);--usage-delta-up:light-dark(#16a34a,#4ade80);--usage-delta-down:light-dark(#dc2626,#f87171)}
.usage-chart text,.usage-heatmap text,.usage-range,.usage-metric strong,.usage-cache-values dd,.usage-model-key small{font-family:var(--font-mono)}
.usage-page h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.4px}
.usage-page h2{margin:0;font-size:14px;font-weight:600}
.usage-header{display:flex;justify-content:space-between;align-items:center;gap:16px}
.usage-header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.usage-note{color:var(--usage-secondary);font-size:12px;line-height:1.5}
.usage-freshness{display:flex;flex-wrap:wrap;gap:6px 8px;margin:4px 0 0;color:var(--usage-secondary);font-size:12px;font-variant-numeric:tabular-nums}
.usage-freshness span+span::before{content:'·';margin-right:8px}
.usage-refresh{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;padding:0;border:1px solid var(--color-shell-seam)!important;border-radius:50%;background:var(--usage-panel)!important;color:var(--color-text-primary)}
.usage-refresh-icon{width:15px;height:15px}
.usage-refresh:hover{background:var(--color-shell-hover)!important}
.animate-spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.usage-range{display:flex;gap:4px;padding:2px;border:0;background:transparent}
.usage-range button{padding:7px 12px;font-size:12px;border-radius:999px;color:var(--usage-secondary)}
.usage-range button:hover{background:var(--color-shell-hover)}
.usage-range button[aria-pressed=true]{color:var(--color-accent);background:color-mix(in srgb,var(--color-accent) 12%,transparent)}
.usage-page button:focus-visible,.usage-page summary:focus-visible,.usage-page g:focus-visible,.usage-page svg:focus-visible{outline:2px solid var(--usage-selection);outline-offset:3px}
.usage-overview{margin:20px 0 16px}
.usage-comparison{margin:0 0 7px;color:var(--usage-secondary);font-size:11px}
.usage-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--color-shell-seam);border:1px solid var(--color-shell-seam);border-radius:10px;overflow:hidden}
.usage-metric{min-width:0;padding:15px 16px 13px;background:var(--usage-panel)}
.usage-metric h2{margin:0 0 8px;color:var(--usage-secondary);font:500 11px var(--font-sans)!important}
.usage-metric strong{display:block;font-size:26px;line-height:1.12;letter-spacing:-.03em;font-weight:500;font-variant-numeric:tabular-nums}
.usage-metric-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 8px;min-height:18px;margin-top:10px}
.usage-metric-foot svg{width:64px;height:18px;margin-left:auto}
.usage-metric-foot polyline{fill:none;stroke:var(--usage-metric-color,var(--usage-tokens));stroke-width:1.4;stroke-linejoin:round}
.usage-metric-sessions{--usage-metric-color:var(--usage-sessions)}.usage-metric-requests{--usage-metric-color:var(--usage-requests)}.usage-metric-cache{--usage-metric-color:var(--usage-cache)}
.usage-metric-delta{font:500 11px var(--font-mono);color:var(--usage-secondary);white-space:nowrap}
.usage-delta-up{color:var(--usage-delta-up)}.usage-delta-down{color:var(--usage-delta-down)}.usage-delta-flat{color:var(--usage-muted)}
.usage-panels{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.usage-panel{min-width:0;padding:17px 17px 15px;border:1px solid var(--color-shell-seam);border-radius:10px;background:var(--usage-panel)}
.usage-page .usage-panel-heading{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;font-weight:600;color:var(--color-text-primary)}
.usage-chart{width:100%;display:block;overflow:visible}
.usage-axis{fill:var(--usage-muted);font-size:10px;font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
.usage-selected{fill:var(--usage-selection);fill-opacity:.12}
.usage-selection-underline{fill:var(--usage-selection)}
.usage-legend{display:flex;flex-wrap:wrap;gap:7px 16px;list-style:none;margin:12px 0 0;padding:0;font-size:11px;color:var(--usage-secondary)}
.usage-legend>span{display:flex;align-items:center;gap:6px}
.usage-legend b{font-family:var(--font-mono);font-size:10px;font-weight:400}
.usage-token-flow-panel{padding:20px 18px 18px}
.usage-flow-toolbar{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px 20px;margin-bottom:6px}
.usage-page .usage-flow-toolbar .usage-panel-heading{margin:0}
.usage-flow-controls{display:flex;gap:8px;flex-wrap:wrap}
.usage-flow-grid-line{stroke:var(--usage-grid);stroke-width:1}
.usage-flow-hover-point{stroke:var(--usage-panel);stroke-width:1.5}
.usage-flow-legend{margin-top:12px;gap:8px}
.usage-flow-series-toggle{display:flex;align-items:center;gap:7px;padding:7px 10px!important;border:1px solid var(--color-shell-seam)!important;border-radius:999px;color:var(--color-text-primary);font-size:11px!important}
.usage-flow-series-toggle:hover{background:var(--color-shell-hover)}
.usage-flow-series-toggle[aria-pressed=false]{opacity:.48}
.usage-flow-series-toggle b{color:var(--usage-muted)}
.usage-flow-series-eye{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.usage-chart-tooltip>rect{fill:var(--usage-panel);stroke:var(--usage-secondary);stroke-width:.6}
.usage-chart-tooltip text{fill:var(--usage-secondary);font:11px var(--font-mono)}
.usage-chart-tooltip .usage-tooltip-title{fill:var(--color-text-primary);font-weight:500}
.usage-flow-tooltip>rect{fill:var(--usage-panel);stroke:var(--color-shell-seam);stroke-width:1}
.usage-flow-tooltip text{fill:var(--usage-secondary);font:11px var(--font-sans)}
.usage-flow-tooltip .usage-tooltip-title,.usage-flow-tooltip .usage-flow-tooltip-value{fill:var(--color-text-primary);font-weight:600}
.usage-day-detail{margin-top:16px;padding-top:14px;border-top:1px solid var(--color-shell-seam)}
.usage-detail-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.usage-detail-header h3{margin:0;font-size:14px;font-weight:600}
.usage-detail-header button{color:var(--color-accent);font-size:12px;padding:5px 10px}
.usage-day-figures{display:flex;flex-wrap:wrap;gap:18px 28px;margin:12px 0 16px;color:var(--usage-secondary);font-size:12px}
.usage-day-figures>div{display:flex;flex-direction:column;gap:2px}
.usage-day-figures strong{font:500 22px var(--font-mono);letter-spacing:-.025em;color:var(--color-text-primary)}
.usage-page table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.usage-page th,.usage-page td{padding:10px 8px;border-bottom:1px solid var(--color-shell-seam);text-align:right;vertical-align:top}
.usage-page th:first-child,.usage-page td:first-child{text-align:left}
.usage-page th{font-weight:500}
.usage-page thead{color:var(--usage-secondary)}
.usage-page caption{text-align:left;font-weight:600;padding:12px 0}
.usage-session-table th:first-child{width:60%}
.usage-page .usage-session-table thead th{font:600 11px var(--font-sans)}
.usage-session-name{color:var(--color-accent)!important;text-align:left;font-weight:500!important}
.usage-session-name:hover{text-decoration:underline;text-underline-offset:2px}
.usage-session-project{display:block;margin-top:4px;color:var(--usage-secondary);font-size:11px;font-weight:400}
.usage-table-scroll{overflow-x:auto}
.usage-secondary-panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.usage-area-cache{color:var(--usage-cache)}
.usage-trend-chart{margin-top:12px}
.usage-area-fill{fill:currentColor;fill-opacity:.09}
.usage-trend-grid{stroke:var(--usage-grid);stroke-width:1}
.usage-area-line{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.usage-area-point{fill:currentColor;stroke:var(--usage-panel);stroke-width:1.5}
.usage-trend-marker{stroke:currentColor;stroke-opacity:.5;stroke-dasharray:3 3}
.usage-details-card-header{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;min-height:50px;margin-bottom:2px}
.usage-page .usage-details-card-header .usage-panel-heading{margin:0}
.usage-details-card-header p{margin:3px 0 0;color:var(--usage-secondary);font-size:11.5px;line-height:1.4}
.usage-details-card-header>strong{font:500 32px/1 var(--font-mono);letter-spacing:-.035em;white-space:nowrap}
.usage-page .usage-details-values{display:flex;flex-direction:column;margin:14px 0 0;font-size:12.5px}
.usage-page .usage-details-values>div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--color-shell-seam)}
.usage-page .usage-details-values>div:first-child{border-top:0}
.usage-page .usage-details-values dt{display:flex;align-items:center;gap:8px;color:var(--usage-secondary)}
.usage-page .usage-details-values dt i{width:9px;height:9px;flex:none;border-radius:2.5px}
.usage-page .usage-details-values dd{margin:0;font:400 12px var(--font-mono);white-space:nowrap}
.usage-details-cache-read{background:var(--usage-cache)}.usage-details-fresh{background:var(--usage-fresh)}.usage-details-cache-write{background:var(--usage-writes)}
.usage-model-scope{justify-content:flex-end;width:max-content;margin-left:auto}
.usage-model-mix{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:20px;align-items:center;min-height:210px;margin-top:10px}
.usage-details-donut{position:relative}
.usage-model-donut{display:block;width:100%}
.usage-details-donut path{cursor:pointer;transition:opacity .15s}
.usage-details-donut .usage-model-selected{stroke:var(--usage-panel);stroke-width:2px}
.usage-details-donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.usage-details-donut-center span{max-width:96px;overflow:hidden;color:var(--usage-secondary);font:11px/1.2 var(--font-mono);text-overflow:ellipsis;white-space:nowrap}
.usage-details-donut-center strong{margin-top:5px;font:500 25px/1 var(--font-mono);letter-spacing:-.025em}
.usage-details-donut-center>strong:only-child{font:500 18px/1.15 var(--font-sans);letter-spacing:-.01em}
.usage-details-donut-center small{margin-top:4px;color:var(--usage-secondary);font:11px/1.2 var(--font-mono)}
.usage-model-key{display:grid;list-style:none;margin:0;padding:0}
.usage-model-key li+li{border-top:1px solid var(--color-shell-seam)}
.usage-model-key button{display:grid;grid-template-columns:9px minmax(0,1fr) auto 46px;align-items:center;gap:8px;width:100%;padding:8px 3px;text-align:left;font-size:12px;border-radius:4px}
.usage-model-key button:hover{background:var(--color-shell-hover)}
.usage-model-key button b,.usage-model-key button small{text-align:right;font:400 11px var(--font-mono);white-space:nowrap}
.usage-model-key button small{color:var(--usage-secondary)}
.usage-model-muted{opacity:.45}
.usage-tool-ok{fill:var(--usage-success);background:var(--usage-success)}
.usage-tool-error{fill:var(--usage-errors);background:var(--usage-errors)}
.usage-tool-unmatched{fill:var(--usage-other);background:var(--usage-other)}
.usage-tool-legend{justify-content:flex-end;margin:0 0 4px}
.usage-tool-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.usage-tool-bars{margin-top:10px}
.usage-tool-bars button{display:grid;grid-template-columns:76px minmax(0,1fr) 58px;gap:11px;align-items:center;width:calc(100% + 10px);padding:6px 5px;margin-inline:-5px;border-radius:5px;text-align:left;font-size:12px}
.usage-tool-bars button>span{overflow:hidden;text-overflow:ellipsis}
.usage-tool-bars button>b{text-align:right;font:400 11px var(--font-mono)}
.usage-tool-bars button:hover,.usage-tool-bars button[aria-pressed=true]{background:var(--color-shell-hover)}
.usage-tool-bars svg{display:block;width:100%;height:11px}
.usage-tool-error-trend{margin-top:18px;padding-top:15px;border-top:1px solid var(--color-shell-seam)}
.usage-tool-error-trend>header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.usage-tool-error-trend h3{margin:0;font-size:13px;font-weight:550}
.usage-tool-error-trend header p{margin:3px 0 0;color:var(--usage-secondary);font-size:11.5px}
.usage-tool-build-toggle{display:inline-flex;align-items:center;gap:7px;padding:5px 8px!important;border:1px solid var(--color-shell-seam)!important;border-radius:5px;color:var(--usage-secondary);font-size:11px!important}
.usage-tool-build-toggle:hover,.usage-tool-build-toggle[aria-pressed=true]{background:var(--color-shell-hover);color:var(--color-text-primary)}
.usage-tool-build-toggle i{width:7px;height:7px;transform:rotate(45deg);border-radius:1px;background:var(--usage-violet)}
.usage-tool-picker{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
.usage-tool-picker button{display:inline-flex;align-items:center;gap:6px;padding:5px 8px!important;border:1px solid var(--color-shell-seam)!important;border-radius:999px;color:var(--usage-secondary);font-size:11px!important}
.usage-tool-picker button:hover{background:var(--color-shell-hover);color:var(--color-text-primary)}
.usage-tool-picker button[aria-pressed=true]{border-color:var(--usage-errors)!important;background:color-mix(in srgb,var(--usage-errors) 8%,transparent);color:var(--color-text-primary)}
.usage-tool-error-chart{display:block;width:100%;overflow:visible}
.usage-tool-error-grid{stroke:var(--color-shell-seam);stroke-width:1}
.usage-tool-error-line{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.usage-tool-error-series circle{fill:var(--usage-panel);stroke-width:2;cursor:pointer}
.usage-tool-error-series g[aria-pressed=true] circle{stroke-width:4}
.usage-tool-build-marker{cursor:pointer}
.usage-tool-build-marker path{stroke:var(--usage-panel);stroke-width:1}
.usage-tool-build-marker[aria-pressed=true] path{stroke:var(--color-text-primary);stroke-width:2}
.usage-readout{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;min-height:18px;margin-top:4px;font-size:11px}
.usage-readout span{color:var(--usage-secondary);font-family:var(--font-mono)}
.usage-readout button{text-decoration:underline}
.usage-chart-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;color:var(--usage-secondary);font-size:12px}
.usage-heat-key{display:flex;align-items:center;gap:4px}
.usage-heat-key i{display:block;width:10px;height:10px;border-radius:2px}
.usage-heat-0{fill:color-mix(in srgb,var(--color-text-primary) 8%,var(--usage-panel));background:color-mix(in srgb,var(--color-text-primary) 8%,var(--usage-panel))}
.usage-heat-1{fill:light-dark(oklch(from var(--color-accent) .9 calc(c * .35) h),oklch(from var(--color-accent) .4 calc(c * .6) h));background:light-dark(oklch(from var(--color-accent) .9 calc(c * .35) h),oklch(from var(--color-accent) .4 calc(c * .6) h))}
.usage-heat-2{fill:light-dark(oklch(from var(--color-accent) .81 calc(c * .55) h),oklch(from var(--color-accent) .5 calc(c * .75) h));background:light-dark(oklch(from var(--color-accent) .81 calc(c * .55) h),oklch(from var(--color-accent) .5 calc(c * .75) h))}
.usage-heat-3{fill:light-dark(oklch(from var(--color-accent) .72 calc(c * .75) h),oklch(from var(--color-accent) .6 calc(c * .85) h));background:light-dark(oklch(from var(--color-accent) .72 calc(c * .75) h),oklch(from var(--color-accent) .6 calc(c * .85) h))}
.usage-heat-4{fill:light-dark(oklch(from var(--color-accent) .63 calc(c * .9) h),oklch(from var(--color-accent) .7 calc(c * .95) h));background:light-dark(oklch(from var(--color-accent) .63 calc(c * .9) h),oklch(from var(--color-accent) .7 calc(c * .95) h))}
.usage-heat-5{fill:var(--color-accent);background:var(--color-accent)}
.usage-heat-selected{stroke:var(--color-text-primary);stroke-width:1.5px}
.usage-heatmap{display:block;width:100%;height:auto}
.usage-heatmap g{cursor:pointer}.usage-heatmap g[aria-disabled=true]{cursor:default}
.usage-heatmap g:focus{outline:none}.usage-heatmap g:focus-visible rect{stroke:var(--color-text-primary);stroke-width:2px}
.usage-interaction-readout{display:flex;flex-wrap:wrap;gap:6px 16px;min-height:18px;margin-top:10px;color:var(--usage-secondary);font-size:12px}
.usage-interaction-readout strong{color:var(--color-text-primary);font-weight:500}
.usage-auto-mode{display:grid;gap:16px;margin:16px 0 0}
.usage-auto-flow-heading{margin:0 0 4px;font-size:14px;font-weight:600}
.usage-auto-flow-chart{display:block;width:100%;height:auto}
.usage-auto-flow-ribbon{--fc:var(--usage-other);fill:none;stroke:var(--fc);stroke-opacity:.23;transition:stroke-opacity .12s ease}
.usage-auto-flow-ribbon-active{stroke-opacity:.55}
.usage-auto-flow-hit{fill:none;stroke:transparent;cursor:pointer}
.usage-auto-flow-node{fill:var(--usage-other)}
.usage-auto-flow-node-label{fill:var(--usage-secondary);font:11px var(--font-mono);paint-order:stroke;pointer-events:none;stroke:var(--usage-panel);stroke-linejoin:round;stroke-width:3px}
.usage-auto-flow-node-attempts{fill:var(--usage-selection)}
.usage-auto-flow-node-allowed,.usage-auto-flow-ribbon-allowed{--fc:var(--usage-success);fill:var(--usage-success)}
.usage-auto-flow-ribbon-allowed,.usage-auto-flow-ribbon-blocked{fill:none}
.usage-auto-flow-node-blocked,.usage-auto-flow-ribbon-blocked{--fc:var(--usage-errors)}
.usage-auto-flow-node-blocked{fill:var(--usage-errors)}
.usage-auto-mode-block-rate{margin-top:18px;padding-top:15px;border-top:1px solid var(--color-shell-seam)}
.usage-auto-mode-block-rate>header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.usage-auto-mode-block-rate h3,.usage-auto-bars-chart h3{margin:0;font-size:13px;font-weight:550}
.usage-auto-mode-block-rate header p{margin:3px 0 0;color:var(--usage-secondary);font-size:11.5px}
.usage-auto-mode-block-rate-headline{display:flex;flex-direction:column;align-items:flex-end;gap:2px;color:var(--usage-secondary);font:11px var(--font-mono)}
.usage-auto-mode-block-rate-headline strong{color:var(--color-text-primary);font-size:14px;font-weight:550}
.usage-auto-mode-block-rate-grid{stroke:var(--color-shell-seam)}
.usage-auto-mode-block-rate-line{fill:none;stroke:var(--usage-coral);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.usage-auto-mode-block-rate-dot{fill:var(--usage-coral);stroke:var(--usage-panel);stroke-width:2;cursor:pointer}
.usage-auto-mode-block-rate-dot.prov{fill:var(--usage-panel);stroke:var(--usage-coral)}
.usage-auto-bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.usage-auto-bars-scroll{overflow-x:auto;margin-top:10px}
.usage-auto-decision-chart{display:block;width:100%;height:auto;overflow:visible}
.usage-auto-bars-grid{stroke:var(--usage-grid)}
.usage-auto-outcome-allowed{fill:var(--usage-success);background:var(--usage-success)}
.usage-auto-outcome-blocked{fill:var(--usage-errors);background:var(--usage-errors)}
.usage-auto-outcome-error{fill:var(--usage-violet);background:var(--usage-violet)}
.usage-auto-outcome-cancelled{fill:var(--usage-other);background:var(--usage-other)}
.usage-auto-decision-chart rect{cursor:pointer}
.usage-auto-bars-readout{min-height:16px;margin:5px 0 0;color:var(--usage-secondary);font:11px var(--font-mono)}
.usage-auto-outcome-legend{display:flex;flex-wrap:wrap;gap:7px 13px;margin:10px 0 0;padding:0;list-style:none;color:var(--usage-secondary);font-size:11px}
.usage-auto-outcome-legend li{display:flex;align-items:center;gap:5px}
.usage-auto-outcome-legend i{width:8px;height:8px;border-radius:2px}
.usage-auto-outcome-legend b{color:var(--color-text-primary);font:500 11px var(--font-mono)}
.usage-auto-category-bars{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none}
.usage-auto-category-bars li>div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:baseline;gap:7px;margin-bottom:4px;font-size:11.5px}
.usage-auto-category-bars b,.usage-auto-category-bars small{font-family:var(--font-mono);font-weight:500}
.usage-auto-category-bars small{color:var(--usage-secondary);font-weight:400}
.usage-auto-category-bars svg{display:block;width:100%;height:8px}
.usage-auto-category-track{fill:color-mix(in srgb,var(--color-surface-panel) 80%,var(--color-text-primary))}
.usage-auto-category-fill{fill:var(--usage-errors)}
.usage-values{margin-top:18px;border-top:1px solid var(--color-shell-seam);padding-top:12px;font-size:12px}
.usage-values>summary{cursor:pointer;padding:10px 0;color:var(--color-text-primary);font-size:13px;font-weight:600}
.usage-values-sections{display:grid;gap:18px;padding:6px 0 20px}
.usage-values-sections>section{min-width:0;padding:14px 16px;border:1px solid var(--color-shell-seam);border-radius:10px;background:var(--usage-panel)}
.usage-values-sections table{min-width:max-content}
.usage-values-definition{margin:4px 0 0;color:var(--usage-secondary);font-size:11px}
.tc{position:relative}
.tc svg{display:block;width:100%;overflow:visible}
.tc svg:focus{outline:none}
.tc svg:focus-visible{outline:2px solid var(--usage-selection);outline-offset:3px}
.m-dim{opacity:.28;transition:opacity .15s}
.usage-heatmap rect.hx{stroke:var(--color-text-primary);stroke-width:1.5px}
.tc-tip{position:absolute;pointer-events:none;z-index:3;display:none}

/* ================= LEDGER ================= */
.win[data-dir=ledger]{
  .usage-page{background:var(--color-app-bg);padding:0 40px 72px}
  .usage-content{max-width:1120px;--lg-ink:var(--color-text-primary);--lg-rule:color-mix(in srgb,var(--color-text-primary) 14%,transparent);--lg-hair:color-mix(in srgb,var(--color-text-primary) 8%,transparent)}
  .lg-top{position:sticky;top:0;z-index:4;background:var(--color-app-bg);padding:26px 0 0}
  .lg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:14px;border-bottom:1px solid var(--lg-ink)}
  .lg-head h1{font-size:26px;font-weight:500;letter-spacing:-.02em}
  .lg-head p{margin:6px 0 0;color:var(--usage-secondary);font-size:12.5px}
  .lg-range{display:flex;gap:18px;font-size:13px}
  .lg-range button{color:var(--usage-secondary);padding:4px 0;border-bottom:1.5px solid transparent}
  .lg-range button[aria-pressed=true]{color:var(--lg-ink);border-bottom-color:var(--color-accent)}
  .lg-range button:hover{color:var(--lg-ink)}
  .lg-read{display:flex;gap:28px;align-items:baseline;min-height:34px;padding:9px 0;border-bottom:1px solid var(--lg-rule);font:12px var(--font-mono);color:var(--usage-secondary)}
  .lg-read strong{color:var(--lg-ink);font:500 12px var(--font-sans)}
  .lg-read b{color:var(--lg-ink);font-weight:500}
  .lg-read .pin{color:var(--color-accent)}
  .lg-figs{display:grid;grid-template-columns:repeat(5,1fr);margin:26px 0 8px}
  .lg-fig{padding:0 18px;border-left:1px solid var(--lg-rule)}
  .lg-fig:first-child{padding-left:0;border-left:0}
  .lg-fig h2{font:500 11.5px var(--font-sans);color:var(--usage-secondary);margin:0 0 10px}
  .lg-fig strong{display:block;font:400 34px/1 var(--font-sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .lg-fig small{display:block;margin-top:9px;font:11px var(--font-mono);color:var(--usage-secondary)}
  .lg-fig small em{font-style:normal;color:var(--lg-ink)}
  .lg-sec{display:grid;grid-template-columns:170px minmax(0,1fr);gap:28px;padding:26px 0;border-top:1px solid var(--lg-rule)}
  .lg-sec:first-of-type{border-top:0}
  .lg-label h2{font-size:13.5px;font-weight:600;margin:0}
  .lg-label p{margin:6px 0 0;color:var(--usage-secondary);font-size:11.5px;line-height:1.45}
  .lg-label .big{display:block;margin-top:14px;font:400 30px/1 var(--font-sans);letter-spacing:-.03em;color:var(--lg-ink)}
  .lg-switch{display:flex;gap:14px;margin-top:14px;font-size:12px}
  .lg-switch button{color:var(--usage-secondary);border-bottom:1px solid transparent;padding:2px 0}
  .lg-switch button[aria-pressed=true]{color:var(--lg-ink);border-bottom-color:var(--lg-ink)}
  .lg-mult{display:grid;grid-template-columns:110px minmax(0,1fr) 80px;align-items:center;column-gap:14px;border-top:1px solid var(--lg-hair)}
  .lg-mult:first-child{border-top:0}
  .lg-mult>span{font-size:12.5px}
  .lg-mult>b{text-align:right;font:400 12px var(--font-mono)}
  .lg-mult>b small{display:block;color:var(--usage-secondary);font-size:10.5px;margin-top:2px}
  .usage-axis{fill:color-mix(in srgb,var(--color-text-primary) 45%,transparent)}
  .usage-flow-grid-line,.usage-trend-grid,.usage-tool-error-grid,.usage-auto-mode-block-rate-grid,.usage-auto-bars-grid{stroke:var(--lg-hair)}
  .lg-cross{stroke:var(--lg-ink);stroke-width:1}
  .lg-cross.sel{stroke:var(--color-accent)}
  .lg-dot{fill:var(--color-app-bg);stroke:var(--lg-ink);stroke-width:1.5}
  .tc-tip{display:none!important}
  .lg-day{margin-top:18px;padding:16px 0 0;border-top:1px solid var(--lg-ink)}
  .lg-day header{display:flex;justify-content:space-between;align-items:baseline}
  .lg-day h3{margin:0;font-size:15px;font-weight:600}
  .lg-day header button{font-size:12px;color:var(--color-accent)}
  .usage-day-figures strong{font:400 24px var(--font-sans)}
  .usage-page table th,.usage-page table td{border-bottom-color:var(--lg-hair)}
  .lg-share{display:flex;gap:2px;height:14px;margin:4px 0 14px}
  .lg-share i{display:block;height:100%;transition:opacity .15s}
  .lg-table{width:100%}
  .lg-table tr{cursor:pointer}
  .lg-table td,.lg-table th{padding:8px 6px!important}
  .lg-table tr:hover td{background:var(--color-shell-hover)}
  .lg-table .sw{display:inline-block;width:9px;height:9px;margin-right:8px;vertical-align:-1px}
  .lg-tools{display:grid;grid-template-columns:90px minmax(0,1fr) 64px 58px minmax(0,1.2fr);align-items:center;column-gap:14px;font-size:12px}
  .lg-tools>.h{color:var(--usage-secondary);font-size:11px;padding-bottom:6px;border-bottom:1px solid var(--lg-rule)}
  .lg-tools>.c{padding:5px 0;border-bottom:1px solid var(--lg-hair);min-height:40px;display:flex;align-items:center}
  .lg-tools>.r{justify-content:flex-end;font:12px var(--font-mono)}
  .lg-bar{height:5px;background:var(--lg-ink);opacity:.85}
  .lg-bar.err{display:inline-block}
  .lg-tools .tc{width:100%}
  .usage-heat-0{fill:color-mix(in srgb,var(--color-text-primary) 6%,var(--color-app-bg));background:color-mix(in srgb,var(--color-text-primary) 6%,var(--color-app-bg))}
  .usage-heat-1{fill:color-mix(in srgb,var(--lg-ink) 18%,var(--color-app-bg));background:color-mix(in srgb,var(--lg-ink) 18%,var(--color-app-bg))}
  .usage-heat-2{fill:color-mix(in srgb,var(--lg-ink) 34%,var(--color-app-bg));background:color-mix(in srgb,var(--lg-ink) 34%,var(--color-app-bg))}
  .usage-heat-3{fill:color-mix(in srgb,var(--lg-ink) 52%,var(--color-app-bg));background:color-mix(in srgb,var(--lg-ink) 52%,var(--color-app-bg))}
  .usage-heat-4{fill:color-mix(in srgb,var(--lg-ink) 72%,var(--color-app-bg));background:color-mix(in srgb,var(--lg-ink) 72%,var(--color-app-bg))}
  .usage-heat-5{fill:var(--lg-ink);background:var(--lg-ink)}
  .usage-heat-selected{stroke:var(--color-accent);stroke-width:2px}
  .usage-auto-flow-ribbon{stroke-opacity:.14}
  .usage-auto-flow-node,.usage-auto-flow-node-attempts{fill:var(--lg-ink)}
  .usage-auto-flow-node-label{stroke:var(--color-app-bg)}
  .usage-auto-mode-block-rate,.usage-auto-bars-chart{border-top:0;padding-top:0;margin-top:0}
  .usage-auto-mode-block-rate-line{stroke:var(--lg-ink);stroke-width:1.5}
  .usage-auto-mode-block-rate-dot{fill:var(--lg-ink);stroke:var(--color-app-bg)}
  .usage-auto-mode-block-rate-dot.prov{fill:var(--color-app-bg);stroke:var(--lg-ink)}
  .usage-auto-category-fill{fill:var(--lg-ink)}
  .usage-auto-category-bars svg{height:4px}
  .usage-details-cache-read{background:var(--lg-ink)}.usage-details-fresh{background:color-mix(in srgb,var(--lg-ink) 45%,transparent)}.usage-details-cache-write{background:color-mix(in srgb,var(--lg-ink) 20%,transparent)}
  .usage-auto-category-track{fill:var(--lg-hair)}
  .lg-auto{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px 34px}
  .lg-auto>.w{grid-column:1/-1}
  .usage-values{border-top:1px solid var(--lg-ink)}
  .usage-values-sections>section{border:0;border-top:1px solid var(--lg-rule);border-radius:0;background:transparent;padding:14px 0}
}

/* ================= CONSOLE ================= */
.win[data-dir=console]{
  .usage-page{background:#0a0a0c;padding:14px 16px 40px;font-family:var(--font-mono)}
  .usage-content{max-width:none;--usage-panel:#0e0e11;--cn-line:rgba(255,255,255,.08);--cn-dim:#6e6e76;--cn-fg:#d8d8dc;--cn-hi:#f4f4f5;--cn-cache:#7c5cff;--cn-fresh:#0b9bcc;--cn-out:#e0408f;--cn-ok:#34d399;--cn-err:#f87171;font-size:11.5px;color:var(--cn-fg)}
  button{font-family:var(--font-mono)}
  .cn-head{display:flex;align-items:center;gap:14px;padding:0 2px 10px;border-bottom:1px solid var(--cn-line)}
  .cn-head h1{font:500 13px var(--font-mono);letter-spacing:0;text-transform:lowercase;color:var(--cn-hi)}
  .cn-head .meta{color:var(--cn-dim)}
  .cn-head .sp{flex:1}
  .cn-seg{display:flex;border:1px solid var(--cn-line)}
  .cn-seg button{padding:4px 10px;color:var(--cn-dim);border-left:1px solid var(--cn-line)}
  .cn-seg button:first-child{border-left:0}
  .cn-seg button[aria-pressed=true]{background:var(--cn-hi);color:#0a0a0c}
  .cn-seg button:hover:not([aria-pressed=true]){color:var(--cn-hi)}
  .cn-keys{color:var(--cn-dim)}
  .cn-keys kbd{font:inherit;padding:0 4px;border:1px solid var(--cn-line);color:var(--cn-fg)}
  .cn-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1px;background:var(--cn-line);border:1px solid var(--cn-line);margin-top:10px}
  .cn-p{background:#0a0a0c;min-width:0;padding:10px 12px 12px}
  .cn-t{display:flex;align-items:center;gap:10px;margin:-10px -12px 10px;padding:6px 12px;border-bottom:1px solid var(--cn-line);color:var(--cn-dim);text-transform:lowercase}
  .cn-t b{color:var(--cn-hi);font-weight:500}
  .cn-t .sp{flex:1}
  .cn-t button{color:var(--cn-dim)}
  .cn-t button[aria-pressed=true]{color:var(--cn-hi)}
  .cn-t button:hover{color:var(--cn-hi)}
  .s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
  .cn-kpi h2{font:400 11px var(--font-mono);color:var(--cn-dim);text-transform:lowercase;margin:0}
  .cn-kpi strong{display:block;margin-top:6px;font:500 22px/1 var(--font-mono);color:var(--cn-hi);letter-spacing:-.02em}
  .cn-kpi .d{margin-left:8px;font-size:11px;font-weight:400}
  .cn-kpi .up{color:#4ade80}.cn-kpi .down{color:#f87171}.cn-kpi .flat{color:var(--cn-dim)}
  .cn-kpi svg{display:block;width:100%;height:26px;margin-top:10px}
  .cn-kpi rect{fill:#3a3a42}.cn-kpi rect.on{fill:var(--cn-hi)}
  .usage-axis{fill:var(--cn-dim);font-size:10px}
  .usage-flow-grid-line,.usage-trend-grid,.usage-tool-error-grid,.usage-auto-mode-block-rate-grid,.usage-auto-bars-grid{stroke:var(--cn-line);stroke-dasharray:2 3}
  .cn-bars rect{shape-rendering:crispEdges}
  .cn-col{fill:rgba(255,255,255,.06)}
  .cn-col.sel{fill:color-mix(in srgb,var(--color-accent) 22%,transparent)}
  .cn-cross{stroke:var(--cn-hi);stroke-width:1;stroke-dasharray:2 2}
  .tc-tip{background:#16161a;border:1px solid #33333a;padding:6px 8px;font:11px/1.55 var(--font-mono);color:var(--cn-fg);white-space:nowrap}
  .tc-tip b{color:var(--cn-hi);font-weight:500}
  .tc-tip i{display:inline-block;width:7px;height:7px;margin-right:6px}
  .tc-tip .v{float:right;margin-left:16px;color:var(--cn-hi)}
  .cn-legend{display:flex;gap:14px;margin-top:8px;color:var(--cn-dim)}
  .cn-legend button{display:flex;gap:6px;align-items:center;color:var(--cn-fg)}
  .cn-legend button[aria-pressed=false]{color:var(--cn-dim);text-decoration:line-through}
  .cn-legend i{width:8px;height:8px;display:inline-block}
  .cn-brush{margin-top:8px;cursor:crosshair;user-select:none}
  .cn-brush rect.b{fill:#2c2c33}
  .cn-brush .win2{fill:rgba(255,255,255,.07);stroke:var(--cn-hi);stroke-width:1}
  .cn-brush .shade{fill:rgba(10,10,12,.72)}
  .cn-tbl{max-height:356px;overflow:auto;margin:-2px -12px -12px}
  .cn-tbl table{font:11px var(--font-mono);width:100%}
  .cn-tbl th,.cn-tbl td{padding:3px 10px!important;border-bottom:1px solid rgba(255,255,255,.04)!important;white-space:nowrap}
  .cn-tbl thead th{position:sticky;top:0;background:#0e0e11;color:var(--cn-dim);font-weight:400;text-transform:lowercase;cursor:pointer}
  .cn-tbl thead th:hover{color:var(--cn-hi)}

    const f = { C, N, P }[e.dataset.fmt], t0 = performance.now();
    const step = now => { const u = Math.min(1, (now - t0) / 600), v = from + (to - from) * (1 - (1 - u) ** 3); e.textContent = f(v); if (u < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* ============================== GLASS page ============================== */
function pageGlass() {
  const sum = cur(), sel = sum.days.find(d => d.date === S.date);
  const idx = RANGES.findIndex(r => r[0] === S.range);
  return `<div class="usage-content">
  <div class="gl-top" id="gl-top"><header class="usage-header"><div><h1 id="usage-title">Analytics</h1><p class="usage-freshness"><span>${periodText(sum)}</span><span>Updated 9:35 AM</span></p></div><div class="usage-header-actions"><button class="usage-refresh" type="button" data-a="refresh" aria-label="Refresh analytics">${REFRESH_SVG}</button><div class="gl-seg" role="group" aria-label="Analytics period"><span class="gl-thumb" id="gl-thumb" style="transform:translateX(${idx * 76}px)"></span>${RANGES.map(([v, l]) => `<button type="button" data-a="range:${v}" aria-pressed="${S.range === v}">${l}</button>`).join('')}</div></div></header></div>

function glSheet() {

  <div class="usage-day-figures" style="display:grid;grid-template-columns:1fr 1fr"><div><strong>${C(T)}</strong> tokens</div><div><strong>${N(sel.sessions)}</strong> sessions</div><div><strong>${N(sel.requests)}</strong> tool requests</div><div><strong>${N(sel.errors)}</strong> errors</div></div>
  <dl class="usage-details-values" style="display:flex;flex-direction:column;margin:0 0 14px;font-size:12.5px">${parts.map(([k, v]) => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:.5px solid var(--gl-line)"><dt style="color:var(--usage-secondary);display:flex;gap:8px;align-items:center"><i style="width:8px;height:8px;border-radius:2px;background:${tcolor(k)}"></i>${{ cache: 'Cache', fresh: 'Input', output: 'Output' }[k]}</dt><dd style="margin:0;font:12px var(--font-mono)">${C(v)}</dd></div>`).join('')}</dl>
  ${S.range === 'all' ? '<p class="usage-note">Session lists cover the last 30 days.</p>' : pContributors(sel.contributors)}</aside>`);
}

/* ============================== directions ============================== */
const htmlTip = { kind: 'html' };
const DIRS = {

  ledger: { name: 'Ledger', themes: ['light', 'dark'], sync: true, nice: true, linkModels: true, crossClass: 'lg-cross', mc: MC_INK, page: pageLedger, heat: { box: 16, max: 20, gap: 3, radius: 1 }, barsFit: true,
    cacheChart: () => ({ series: [{ id: 'cache', label: 'Cache read rate', color: 'var(--lg-ink)' }], look: { fill: 'solid', fillOpacity: .06, points: 'none', cross: 'lg-cross', marker: 3, markerClass: 'lg-dot', strokeW: 1.4 }, tip: { kind: 'none' }, height: 130 }),

    toolColors: ['#3b82f6', '#c07f10', '#16a394', '#9a6cf0', '#0b9bcc', '#e0408f', '#8a9a3a', '#b35a9a', '#a0704a', '#6b7280'],
    cacheChart: () => ({ look: { fill: 'solid', fillOpacity: .14, points: 'none', cross: 'cn-cross', marker: 3.5, markerClass: 'usage-area-point', strokeW: 1.5 }, tip: htmlTip, height: 120, tickY: 3 }),
    onHover: date => cnTableHover(date),
    notes: { what: ['Mono type, 12-column panel grid', 'KPI cells with daily bar strips', 'Stacked daily bars replace area', 'Day table beside the chart', 'Tools as a sortable table', 'Flow as a route table', 'Validated categorical palette'], act: ['Brush strip under bars zooms; dbl-click resets', 'Bar, table row, KPI strip, heatmap hover linked', 'Sortable day table headers', 'Arrow keys step days page-wide, Enter pins, Esc clears', 'Model hover links bars and model list'] } },
  spectrum: { name: 'Spectrum', themes: ['dark'], sync: true, nice: true, linkModels: true, crossClass: 'sp-cross', mc: MC_NEW, tc: TC_NEW, page: pageSpectrum, donutBig: true, barsFit: true,
    toolColors: ['#3b82f6', '#c07f10', '#16a394', '#9a6cf0', '#0b9bcc', '#e0408f', '#8a9a3a', '#b35a9a', '#a0704a', '#6b7280'],
    tokensChart: () => ({ look: { fill: 'grad', stroke: 'line', glow: true, gradTop: .75, gradBottom: .06, cross: 'sp-cross', marker: 5, markerClass: 'sp-dot', thin: true, strokeW: 1.8 }, tip: htmlTip }),
    cacheChart: () => ({ series: [{ id: 'cache', label: 'Cache read rate', color: '#9d86ff' }], look: { fill: 'grad', gradTop: .45, gradBottom: 0, glow: true, curve: true, points: 'none', cross: 'sp-cross', marker: 4.5, markerClass: 'sp-dot', strokeW: 2 }, tip: { kind: 'html', rows: (d, v) => [{ label: 'Cache read rate', color: '#9d86ff', value: P(v[0]) }] } }),
    flowStroke: l => `url(#fg-${l.to === 'allowed' || l.to === 'blocked' ? l.to : 'mid'})`,
    flowDefs: () => `<defs><linearGradient id="fg-mid" x1="0" x2="1"><stop offset="0" stop-color="#b8a6ff"/><stop offset="1" stop-color="#7fd8ff"/></linearGradient><linearGradient id="fg-allowed" x1="0" x2="1"><stop offset="0" stop-color="#7fd8ff"/><stop offset="1" stop-color="#34d399"/></linearGradient><linearGradient id="fg-blocked" x1="0" x2="1"><stop offset="0" stop-color="#7fd8ff"/><stop offset="1" stop-color="#ff6b8b"/></linearGradient></defs>`,
    notes: { what: ['Deep violet canvas, header glow', 'KPI tiles with gradient area sparklines', 'Gradient-filled token layers, glowing edges', 'Validated vivid categorical palette', 'Donut slices pop out', 'Gradient flow ribbons, glowing trend lines'], act: ['Range switch morphs the token area', 'Numbers count up on range change', 'Synced crosshair with floating tooltip', 'Model hover links donut, legend, area (By model)', 'Click a day for detail'] } },
  glass: { name: 'Glass', themes: ['dark', 'light'], sync: true, nice: true, linkModels: true, crossClass: 'gl-cross', tc: { cache: 'var(--usage-cache)', fresh: 'var(--usage-fresh)', output: 'var(--usage-output)' }, page: pageGlass,
    tokensChart: () => ({ look: { fill: 'grad', stroke: 'line', gradTop: .6, gradBottom: .05, cross: 'gl-cross', marker: 4.5, markerClass: 'gl-dot', strokeW: 1.4 }, tip: htmlTip, selectRect: false }),
    cacheChart: () => ({ look: { fill: 'solid', fillOpacity: .12, curve: true, points: 'none', cross: 'gl-cross', marker: 4, markerClass: 'gl-dot', strokeW: 1.8 }, tip: { kind: 'html', rows: (d, v) => [{ label: 'Cache read rate', value: P(v[0]) }] } }),
    notes: { what: ['Translucent panels over window material', 'Sticky header turns to glass on scroll', 'macOS segmented control', 'KPI shelf in one glass slab', 'Soft gradient areas, glass tooltips'], act: ['Sliding thumb on range change', 'Panels settle in on range change', 'Click a day opens a side sheet; Esc closes', 'Synced crosshair', 'Model hover links donut, legend, area (By model)'] } },
};
const ORDER = ['current', 'ledger', 'console', 'spectrum', 'glass'];

/* ============================== render + events ============================== */
let RENDER_ABORT = new AbortController();
function render(opts = {}) {
  RENDER_ABORT.abort(); RENDER_ABORT = new AbortController();
  const page = $('#page'), st = page.scrollTop, win = $('#win');
  HOV = [];
  win.dataset.dir = S.dir; win.dataset.theme = S.theme;
  $('#desk').classList.toggle('light', S.theme === 'light');
  page.innerHTML = D().page();
  $$('[data-m]', page).forEach(el => { const r = M[el.dataset.m](el); if (r) el._chart = r; });
  page.scrollTop = opts.top ? 0 : st;
  if (S.hover) { const h = S.hover, s = S.hsrc; S.hover = ''; setHover(h, s); }
  D().onHover?.('', '');
  modelFocus(S.mfocus);
  glSheet();
  if (S.dir === 'spectrum') { spAnimate(opts); countUp(); } else PREV.counts = {};
  if (S.dir === 'glass') {
    const top = $('#gl-top'); const onScroll = () => top?.classList.toggle('stuck', page.scrollTop > 8); onScroll(); page.addEventListener('scroll', onScroll, { signal: RENDER_ABORT.signal });
    if (opts.rangeChanged) { const th = $('#gl-thumb'), pi = RANGES.findIndex(r => r[0] === opts.prevRange); if (th && pi >= 0) { const ni = RANGES.findIndex(r => r[0] === S.range); th.style.transition = 'none'; th.style.transform = `translateX(${pi * 76}px)`; th.getBoundingClientRect(); th.style.transition = ''; th.style.transform = `translateX(${ni * 76}px)`; } }
    else $('#gl-anim')?.classList.remove('gl-anim');
  }
  if (S.date && opts.focusDetail) $('#day-h')?.focus({ preventScroll: S.dir !== 'current' });
  chrome();
}
function chrome() {
  $('#x-tabs').innerHTML = ORDER.map((k, i) => `<button type="button" data-x="${k}" aria-pressed="${S.dir === k}">${i ? String.fromCharCode(64 + i) + ' ' : ''}${DIRS[k].name}</button>`).join('');
  const t = $('#x-theme'), th = D().themes; t.disabled = th.length < 2; t.textContent = S.theme === 'dark' ? 'Dark' : 'Light';
  const n = D().notes;
  $('#x-notes').innerHTML = `<h4>${D().name}</h4><h5>Changes</h5><ul>${n.what.map(x => `<li>${x}</li>`).join('')}</ul><h5>Interactions</h5><ul>${n.act.map(x => `<li>${x}</li>`).join('')}</ul>`;
}
$('#x-tabs').addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (!b) return; switchDir(b.dataset.x); });
function switchDir(k) { S.dir = k; if (!D().themes.includes(S.theme)) S.theme = D().themes[0]; S.hover = ''; S.mfocus = ''; S.zoom = null; SPEC_PREV = null; render({ top: true }); }
$('#x-theme').addEventListener('click', () => { if (D().themes.length < 2) return; S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); });
$('#x-notes-btn').addEventListener('click', e => { const n = $('#x-notes'); n.hidden = !n.hidden; e.currentTarget.setAttribute('aria-pressed', !n.hidden); $('#x-stage').classList.toggle('x-notes-open', !n.hidden); render(); });
const winEl = $('#win');
winEl.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (!a) return;
  const [k, v] = a.dataset.a.split(':');
  if (k === 'range') { if (S.range === v) return; const prevRange = S.range; S.range = v; S.date = ''; S.zoom = null; S.errPin = null; S.flowPin = null; S.barAct = null; S.toolSel = ''; render({ rangeChanged: true, prevRange }); return; }
  if (k === 'mode') { S.mode = v; SPEC_PREV = null; }
  else if (k === 'allmodels') { S.allModels = v === '1'; SPEC_PREV = null; }
  else if (k === 'donutall') S.donutAll = v === '1';
  else if (k === 'series') { const h = new Set(S.hidden[S.mode]); h.has(v) ? h.delete(v) : h.add(v); S.hidden[S.mode] = [...h]; SPEC_PREV = null; }
  else if (k === 'clear') { S.date = ''; }
  else if (k === 'msel') { S.donutSel = S.donutSel === v ? '' : v; modelFocus(S.mfocus); a.setAttribute?.('aria-pressed', S.donutSel === v); return; }
  else if (k === 'tool') S.toolSel = S.toolSel === v ? '' : v;
  else if (k === 'pick') { const base = errToolsSel(cur()); S.errTools = base.includes(v) ? base.filter(x => x !== v) : [...base, v]; }
  else if (k === 'commits') S.commits = !S.commits;
  else if (k === 'errclear') S.errPin = null;
  else if (k === 'flowclear') S.flowPin = null;
  else if (k === 'table') { e.preventDefault(); S.table = !S.table; }
  else if (k === 'sort') { S.sort = S.sort[0] === v ? [v, -S.sort[1]] : [v, v === 'date' ? -1 : -1]; }
  else if (k === 'unzoom') S.zoom = null;
  else if (k === 'refresh') { a.querySelector('svg')?.classList.add('animate-spin'); setTimeout(() => a.querySelector('svg')?.classList.remove('animate-spin'), 900); return; }
  render();
});
winEl.addEventListener('click', e => { const r = e.target.closest('tr[data-day]'); if (r) select(r.dataset.day === S.date ? '' : r.dataset.day); });
winEl.addEventListener('mouseover', e => {
  const r = e.target.closest('tr[data-day]'); if (r) setHover(r.dataset.day, 'table');
  const m = e.target.closest('[data-mh]'); if (m) modelFocus(m.dataset.mh);
});
winEl.addEventListener('mouseout', e => {
  const r = e.target.closest('tr[data-day]'); if (r && !r.contains(e.relatedTarget)) setHover('', 'table');
  const m = e.target.closest('[data-mh]'); if (m && !m.contains(e.relatedTarget)) modelFocus('');
});
winEl.addEventListener('focusin', e => { const m = e.target.closest('[data-mh]'); if (m) modelFocus(m.dataset.mh); });
winEl.addEventListener('focusout', e => { if (e.target.closest('[data-mh]')) modelFocus(''); });
document.addEventListener('keydown', e => {
  const tg = e.target instanceof Element ? e.target : document.body;
  if (tg.closest('input,textarea')) return;
  if (S.dir === 'glass' && e.key === 'Escape' && S.date) { select(''); return; }
  if (S.dir === 'console' && !tg.closest('svg[tabindex], g[role=button], .x-bar')) {
    const sum = cur(), dom = S.zoom ?? [sum.startDate, sum.endDateExclusive], dates = sum.days.map(d => d.date).filter(d => d >= dom[0] && d < dom[1]);
    const i = dates.indexOf(S.hover || S.date);
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); const n = clamp((i < 0 ? (e.key === 'ArrowRight' ? -1 : dates.length) : i) + (e.key === 'ArrowRight' ? 1 : -1), 0, dates.length - 1); setHover(dates[n], 'kbd'); return; }
    if (e.key === 'Enter' && S.hover) { e.preventDefault(); select(S.hover); return; }
    if (e.key === 'Escape') { setHover('', 'kbd'); if (S.date) select(''); return; }
  }
  if (!tg.closest('.win') && /^[1-5]$/.test(e.key)) switchDir(ORDER[+e.key - 1]);
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => render(), 120); });
(() => { const h = new URLSearchParams(location.hash.slice(1)); if (DIRS[h.get('dir')]) S.dir = h.get('dir'); if (D().themes.includes(h.get('theme'))) S.theme = h.get('theme'); else S.theme = D().themes[0]; if (DATA[h.get('range')]) S.range = h.get('range'); if (h.get('date')) S.date = h.get('date'); if (h.get('mode')) S.mode = h.get('mode'); })();
document.fonts?.ready.then(() => render());
render();
</script>
