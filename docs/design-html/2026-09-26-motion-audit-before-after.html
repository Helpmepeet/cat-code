<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion audit · current vs proposed</title>
<style>
@font-face { font-family: 'DM Sans'; src: url('../../app/renderer/src/assets/fonts/DMSans-Variable.woff2') format('woff2'); font-weight: 100 1000; }
@font-face { font-family: 'DM Mono'; src: url('../../app/renderer/src/assets/fonts/DMMono-Regular.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'DM Mono'; src: url('../../app/renderer/src/assets/fonts/DMMono-Medium.woff2') format('woff2'); font-weight: 500; }

/* ---------- app tokens (theme.css, dark) ---------- */
:root {
  --accent: #f472b6; --accent-rgb: 244 114 182;
  --tone-good: #4ade80; --tone-warn: #fbbf24; --tone-danger: #f87171;
  --app-bg: #09090b; --shell-chrome: #070709; --surface-raised: #111113; --surface-panel: #0a0a0c;
  --shell-seam: rgba(255,255,255,.06); --shell-hover: rgba(255,255,255,.045);
  --text-primary: #f4f4f5; --text-muted: #a1a1aa; --text-subtle: #98989f; --text-faint: #838389; --text-ghost: #75757b;
  --scrim: rgba(0,0,0,.6);
  --elev-menu: 0 18px 44px rgba(0,0,0,.6); --elev-modal: 0 30px 80px rgba(0,0,0,.6);
  --elev-popover: 0 14px 38px rgba(0,0,0,.5); --elev-drawer: -20px 0 60px rgba(0,0,0,.6);
  --elev-rail: 4px 0 24px rgba(0,0,0,.45);
  --tw-ease: cubic-bezier(.4,0,.2,1);
  --ease-enter: cubic-bezier(.2,0,0,1);
  --ease-exit: cubic-bezier(.4,0,1,1);
  color-scheme: dark;
}
html, body { margin: 0; background: var(--app-bg); }

/* ---------- chrome (x-) : not the app ---------- */
.x-page { max-width: 1260px; margin: 0 auto; padding: 28px 28px 160px; font: 500 10px/1.4 Menlo, ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: #8f8a80; }
.x-nav { display: flex; flex-wrap: wrap; gap: 6px 18px; padding-bottom: 20px; }
.x-nav a { color: #8f8a80; text-decoration: none; }
.x-nav a:hover { color: #cfc9bd; }
.x-group { margin-top: 36px; padding-bottom: 6px; color: #cfc9bd; }
.x-row { border-top: 1px solid #2c2a27; padding: 14px 0 30px; }
.x-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
.x-title { color: #cfc9bd; }
.x-btn { font: inherit; letter-spacing: inherit; text-transform: inherit; color: #b3ada1; background: none; border: 1px solid #45413b; padding: 5px 9px; cursor: pointer; }
.x-btn:hover { border-color: #8f8a80; color: #e6e0d4; }
.x-btn[aria-pressed="true"] { border-color: #cfc9bd; color: #e6e0d4; }
.x-sep { width: 1px; height: 14px; background: #2c2a27; }
.x-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.x-grid.x-three { grid-template-columns: 1fr 1fr 1fr; }
.x-grid > div { min-width: 0; }
.x-col-label { margin-bottom: 8px; }
.x-stage { position: relative; overflow: hidden; background: var(--app-bg); }

/* ---------- specimen base ---------- */
.s { font-family: 'DM Sans', system-ui, sans-serif; color: var(--text-primary); letter-spacing: normal; text-transform: none; font-size: 12px; line-height: 16px; font-weight: 400; }
.s *, .s *::before, .s *::after { box-sizing: border-box; }
.s .mono { font-family: 'DM Mono', ui-monospace, monospace; }
.s .dot { width: 6px; height: 6px; border-radius: 9999px; flex: none; display: inline-block; }
.s .pulse { animation: tw-pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
@keyframes tw-pulse { 50% { opacity: .5; } }

/* existing app keyframes */
@keyframes catcode-toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes catcode-sa-pop { from { opacity: 0; transform: scale(.97) translateY(-3px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes catcode-token-warn-in { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }
@keyframes catcode-prose-arrive { from { opacity: 0; } to { opacity: 1; } }
.animate-toast-in { animation: catcode-toast-in .18s ease-out both; }
.animate-sa-pop { animation: catcode-sa-pop .13s ease both; }
.animate-token-warn-in { animation: catcode-token-warn-in .18s ease both; }
.prose-arrive-smooth { animation: catcode-prose-arrive 220ms linear both; }
@keyframes catcode-face-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
.animate-face-pulse { animation: catcode-face-pulse 1.4s ease-in-out infinite; }

/* proposed keyframes */
@keyframes p-pop-up { from { opacity: 0; transform: translateY(3px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes p-drawer-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
@keyframes p-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes p-settle { from { opacity: .6; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes p-land { from { background-color: rgb(var(--accent-rgb) / .10); } to { background-color: transparent; } }
@keyframes p-tab-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
.p-pop-up { animation: p-pop-up 120ms var(--ease-enter) both; transform-origin: bottom left; }
.p-drawer-in { animation: p-drawer-in 200ms var(--ease-enter) both; }
.p-fade-in-120 { animation: p-fade-in 120ms var(--ease-enter) both; }
.p-fade-in-180 { animation: p-fade-in 180ms var(--ease-enter) both; }
.p-settle { animation: p-settle 180ms var(--ease-enter) both; display: inline-flex; align-items: center; gap: 6px; }
.p-land { animation: p-land 900ms var(--tw-ease) both; }
.p-tab-in { animation: p-tab-in 180ms var(--ease-enter) both; }

/* ---- picker ---- */
.s .pick { border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: var(--surface-raised); box-shadow: var(--elev-popover), 0 0 0 1px rgb(var(--accent-rgb) / .06); overflow: hidden; margin: 12px; }
.s .pick-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--shell-seam); padding: 6px 12px; }
.s .pick-slash { border-radius: 4px; background: rgb(var(--accent-rgb) / .15); padding: 0 6px; font-size: 11px; font-weight: 600; color: var(--accent); }
.s .pick-kicker { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--text-ghost); margin-left: 8px; }
.s .pick-list { list-style: none; margin: 0; padding: 4px 0; }
.s .pick-row { display: flex; width: 100%; align-items: baseline; border-left: 2px solid transparent; padding: 4px 12px; }
.s .pick-row.cur-t { transition-property: color, background-color, border-color, outline-color, text-decoration-color, fill, stroke; transition-duration: 150ms; transition-timing-function: var(--tw-ease); }
.s .pick-row.cur-t .pick-name, .s .pick-row.cur-t .pick-desc { transition: color 150ms var(--tw-ease); }
.s .pick-row.on { border-left-color: var(--accent); background: rgb(var(--accent-rgb) / .07); }
.s .pick-name { min-width: 148px; flex: none; font-size: 12.5px; font-weight: 500; letter-spacing: -.01em; color: var(--text-primary); }
.s .pick-row.on .pick-name { color: var(--accent); }
.s .pick-mid { margin-right: 10px; color: var(--text-ghost); }
.s .pick-desc { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; color: var(--text-faint); }
.s .pick-row.on .pick-desc { color: var(--text-muted); }

/* ---- warning glyph ---- */
.s .warn-btn { display: flex; height: 22px; width: 22px; align-items: center; justify-content: center; border-radius: 5px; color: var(--tone-warn); }

/* ---- tabs ---- */
.s .tabbar { display: flex; height: 40px; border-bottom: 1px solid var(--shell-seam); background: var(--shell-chrome); }
.s .tabscroll { display: flex; flex: 1; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.s .tab { position: relative; display: flex; min-width: 90px; max-width: 176px; flex-grow: 1; flex-shrink: 0; align-items: center; gap: 6px; border-right: 1px solid rgba(255,255,255,.05); padding-left: 12px; padding-right: 6px; cursor: pointer; transition: background-color 150ms var(--tw-ease); }
.s .tab:hover { background: rgba(255,255,255,.025); }
.s .tab.active { background: rgba(255,255,255,.05); }
.s .tab .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px; border-radius: 2px 2px 0 0; background: var(--accent); }
.s .tab .title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--text-subtle); }
.s .tab.active .title { color: var(--text-primary); }
.s .tab .close { display: flex; height: 18px; width: 0; flex: none; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; font-size: 14px; line-height: 1; color: rgb(152 152 159 / .6); opacity: 0; border: 0; background: none; padding: 0; }
.s .tab .close.cur-t { transition: all 150ms var(--tw-ease); }
.s .tab .close.pro-t { transition: opacity 150ms var(--tw-ease), background-color 150ms var(--tw-ease), color 150ms var(--tw-ease); }
.s .tab:hover .close { width: 18px; opacity: 1; }
.s .tab .close:hover { background: rgba(255,255,255,.1); color: var(--text-primary); }

/* ---- sidebar ---- */
.s .rail { position: absolute; top: 0; bottom: 0; left: 0; z-index: 5; display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid rgba(255,255,255,.05); background: var(--surface-panel); width: 48px; }
.s .rail.cur-t { transition: width 200ms ease-out, box-shadow 200ms ease-out; }
.s .rail.cur-t.open { width: 288px; box-shadow: var(--elev-rail); }
.s .rail.pro-t { width: 288px; clip-path: inset(0 240px 0 0); transition: clip-path 180ms var(--ease-enter), box-shadow 180ms var(--ease-enter); }
.s .rail.pro-t.open { clip-path: inset(0 0 0 0); box-shadow: var(--elev-rail); }
.s .rail-rows { padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
.s .srow { padding: 6px 8px; border-radius: 6px; min-width: 0; }
.s .srow .t { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s .srow .m { font-size: 11px; color: var(--text-ghost); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s .page-lines { position: absolute; left: 64px; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 9px; }
.s .page-lines i { display: block; height: 7px; border-radius: 2px; background: rgba(255,255,255,.05); }

/* ---- tool card ---- */
.s .card { width: 100%; overflow: hidden; border-radius: 6px; border: 1px solid var(--shell-seam); background: rgba(255,255,255,.025); }
.s .card-head { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 12px; }
.s .fam-mark { width: 16px; flex: none; text-align: center; font-size: 13px; color: #a3e635; }
.s .fam-word { flex: none; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #a3e635; }
.s .card-target { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.s .dot.pro-t { transition: background-color 120ms ease-out; }

/* ---- prose ---- */
.s .prose { font-size: 14px; line-height: 1.6; color: var(--text-primary); padding: 14px 16px; max-width: 560px; min-height: 150px; }

/* ---- permission card ---- */
.s .dock { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
.s .perm { border-left: 2px solid var(--accent); background: rgb(244 244 245 / .04); padding: 12px 16px; }
.s .perm.pro-t { transition: opacity 120ms var(--tw-ease); }
.s .perm.dim { opacity: .55; }
.s .kick { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
.s .perm h2 { margin: 8px 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 600; }
.s .perm h2 code, .s .opt code { border-radius: 4px; background: rgb(var(--accent-rgb) / .1); padding: 2px 6px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent); font-weight: 400; }
.s .opts { margin-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.s .opt { display: flex; width: 100%; align-items: center; gap: 8px; border-radius: 6px; padding: 6px 10px; border: 1px solid transparent; background: none; color: inherit; font: inherit; text-align: left; }
.s .opt.on { border-color: rgb(var(--accent-rgb) / .45); background: rgb(var(--accent-rgb) / .1); }
.s .opt .n { display: flex; height: 15px; width: 15px; flex: none; align-items: center; justify-content: center; border-radius: 4px; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 600; background: rgb(244 244 245 / .06); color: var(--text-subtle); }
.s .opt.on .n { background: var(--accent); color: var(--app-bg); }
.s .opt .l { min-width: 0; flex: 1; font-size: 12px; line-height: 1.375; }
.s .opt.deny .l { color: var(--text-muted); }
.s .composer { border-radius: 12px; border: 1px solid var(--shell-seam); background: var(--surface-raised); padding: 10px 12px; font-size: 13px; color: var(--text-primary); min-height: 42px; }

/* ---- composer popover ---- */
.s .chip { position: absolute; left: 16px; bottom: 16px; font-size: 12px; color: var(--text-muted); }
.s .popover { position: absolute; bottom: 100%; left: 0; margin-bottom: 8px; width: 200px; border-radius: 8px; border: 1px solid var(--shell-seam); background: var(--surface-raised); padding: 6px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1); }
.s .pop-h { padding: 2px 8px 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .025em; color: var(--text-subtle); }
.s .pop-r { padding: 4px 8px; border-radius: 4px; font-size: 12px; color: var(--text-primary); }
.s .pop-r.on { background: rgba(255,255,255,.06); }

/* ---- palette ---- */
.s .scrim { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; background: var(--scrim); padding: 34px 16px 0; backdrop-filter: blur(8px); }
.s .palette { width: 100%; max-width: 576px; overflow: hidden; border-radius: 16px; border: 1px solid rgba(255,255,255,.1); background: var(--surface-raised); box-shadow: var(--elev-modal); }
.s .pal-in { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--shell-seam); padding: 12px 16px; font-size: 14px; color: var(--text-subtle); }
.s .pal-in span { flex: 1; }
.s kbd { border-radius: 4px; background: var(--shell-hover); padding: 2px 6px; font-size: 10px; color: var(--text-ghost); font-family: inherit; }
.s .pal-list { padding: 4px 0; }
.s .pal-r { padding: 8px 16px; font-size: 14px; color: var(--text-primary); }
.s .pal-r.on { background: rgba(255,255,255,.04); }
.s .behind { position: absolute; inset: 0; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.s .behind p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--text-primary); }

/* ---- palette (real) ---- */
.s .pal-in svg { flex: none; color: var(--text-subtle); }
.s .pal-gh { padding: 8px 16px 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--text-ghost); }
.s .pal-row { display: flex; width: 100%; align-items: center; gap: 10px; border-left: 2px solid transparent; padding: 6px 16px; }
.s .pal-row.on { border-left-color: var(--accent); background: rgba(255,255,255,.06); }
.s .pal-row .lb { flex: none; font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s .pal-row.on .lb { color: var(--text-primary); }
.s .pal-row .sess { max-width: 45%; }
.s .pal-row .dt { min-width: 0; flex: 1; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s .pal-row kbd { flex: none; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-subtle); }
.s .pal-foot { display: flex; align-items: center; gap: 16px; border-top: 1px solid var(--shell-seam); padding: 6px 16px; }
.s .pal-foot span { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-ghost); }
.s .pal-foot kbd { border: 1px solid var(--shell-seam); font-family: 'DM Mono', monospace; font-size: 9.5px; color: var(--text-faint); padding: 2px 6px; }
/* ---- drawer (real) ---- */
.s .drawer-hd { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--shell-seam); padding: 16px 20px; }
.s .drawer-hd .tt { font-size: 14px; font-weight: 600; }
.s .drawer-hd .sub { margin-top: 2px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s .ro { flex: none; border-radius: 4px; border: 1px solid var(--shell-seam); padding: 2px 6px; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .025em; color: var(--text-subtle); }
.s .xbtn { display: flex; height: 26px; width: 26px; flex: none; align-items: center; justify-content: center; font-size: 16px; line-height: 1; color: var(--text-subtle); }
.s .dbody { flex: 1; overflow: hidden; padding: 16px 20px; }
.s .dsec { margin-bottom: 20px; }
.s .dsec-t { margin-bottom: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--text-subtle); }
.s .drow { display: grid; grid-template-columns: 128px 1fr; align-items: baseline; column-gap: 12px; padding: 3px 0; }
.s .drow .k { font-size: 11.5px; color: var(--text-subtle); }
.s .drow .v { font-size: 12.5px; color: var(--text-muted); overflow-wrap: anywhere; }
/* ---- settings (real) ---- */
.s .setmain { position: absolute; inset: 0; overflow-y: auto; padding: 28px 32px; scrollbar-width: none; }
.s .setsearch { margin-bottom: 28px; display: flex; height: 38px; align-items: center; gap: 8px; border-radius: 6px; border: 1px solid var(--shell-seam); background: var(--surface-raised); padding: 0 12px; font-size: 13px; }
.s .setsearch .q { flex: 1; color: var(--text-primary); }
.s .setsearch .ph { flex: 1; color: var(--text-subtle); }
.s .setsearch .cl { font-size: 12px; color: var(--text-subtle); }
.s .setsearch kbd { font-size: 11px; color: var(--text-subtle); font-family: inherit; }
.s .set-h2r { font-size: 24px; font-weight: 600; letter-spacing: -.025em; line-height: 32px; }
.s .set-h2 { font-size: 25px; font-weight: 600; letter-spacing: -.025em; line-height: 32px; margin-bottom: 20px; }
.s .set-st { margin: 4px 0 8px; font-size: 13px; color: var(--text-subtle); }
.s .res { display: block; width: 100%; border-bottom: 1px solid var(--shell-seam); padding: 16px 4px; }
.s .res.sel { background: var(--shell-hover); }
.s .res .c { display: block; font-size: 11px; color: var(--text-subtle); }
.s .res .l { margin-top: 4px; display: block; font-size: 14px; font-weight: 500; }
.s .res .d { margin-top: 2px; display: block; font-size: 13px; color: var(--text-subtle); }
/* ---- drawer ---- */
.s .drawer { position: absolute; top: 0; bottom: 0; right: 0; width: min(520px, 92%); display: flex; flex-direction: column; border-left: 1px solid var(--shell-seam); background: var(--surface-panel); box-shadow: var(--elev-drawer); }
.s .drawer-h { border-bottom: 1px solid var(--shell-seam); padding: 16px 20px; font-size: 14px; font-weight: 600; }
.s .kv { display: flex; justify-content: space-between; padding: 8px 20px; font-size: 12px; }
.s .kv b { font-weight: 400; color: var(--text-subtle); }

/* ---- latest pill ---- */
.s .pill { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; border-radius: 9999px; border: 1px solid; padding: 4px 12px; font-size: 11px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1); backdrop-filter: blur(8px); background: rgb(7 7 9 / .9); white-space: nowrap; }
.s .pill.pro-t { transition: color 180ms var(--tw-ease), border-color 180ms var(--tw-ease); }
.s .pill.run { border-color: rgb(var(--accent-rgb) / .5); color: var(--accent); }
.s .pill.idle { border-color: var(--shell-seam); color: var(--text-muted); }
.s .pill .sb { font-weight: 600; }
.s .pill .el { color: var(--text-subtle); }

/* ---- gauge ---- */
.s .gauge { display: flex; align-items: center; gap: 6px; }
.s .gauge .pc { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.s .gauge .arc.pro-t { transition: stroke-dasharray 400ms var(--tw-ease), color 400ms var(--tw-ease); }
.s .gauge.pro-t { transition: color 400ms var(--tw-ease); }
.s .rail-row { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-size: 12px; color: var(--text-muted); }

/* ---- settings ---- */
.s .setpage { position: absolute; inset: 0; overflow-y: auto; padding: 0 24px; scrollbar-width: none; }
.s .setrow { display: flex; min-height: 69px; align-items: center; justify-content: space-between; gap: 32px; border-bottom: 1px solid var(--shell-seam); padding: 16px 0; }
.s .setrow .lab { font-size: 14px; font-weight: 500; line-height: 21px; }
.s .setrow .des { margin-top: 2px; max-width: 58ch; font-size: 13px; line-height: 20px; color: var(--text-subtle); }

/* ---- byline / dock ---- */

<script>
'use strict'
const $ = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild }
const sleep = (ms) => new Promise(r => setTimeout(r, ms))
const restartAnim = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls) }

const DEMOS = []
const def = (d) => DEMOS.push(d)

/* ============ FIXES ============ */

def({
  id: 'picker', group: 'Fix', title: 'Slash picker · arrow-key cursor', h: 250,
  actions: ['Hold ↓', 'Hold ↑'],
  build(side, stage) {
    const cmds = [
      ['compact', 'Summarize the conversation'], ['clear', 'Start a fresh conversation'],
      ['model', 'Choose the model'], ['resume', 'Open an earlier session'],
      ['memory', 'Edit memory files'], ['status', 'Show session status'],
      ['permissions', 'Manage permission rules'], ['review', 'Review the current changes']]
    const box = $(`<div class="pick"><div class="pick-head"><div style="display:flex;align-items:center"><span class="pick-slash mono">/</span><span class="pick-kicker">Commands</span></div><span class="mono" style="font-size:10px;color:var(--text-ghost)">8</span></div><ul class="pick-list"></ul></div>`)
    const ul = box.querySelector('ul')
    const rows = cmds.map(([n, d]) => {
      const li = $(`<li><div class="pick-row ${side === 'cur' ? 'cur-t' : ''}"><span class="pick-name mono">/${n}</span><span class="pick-mid">·</span><span class="pick-desc">${d}</span></div></li>`)
      ul.appendChild(li); return li.firstElementChild })
    stage.appendChild(box)
    let i = 0; rows[0].classList.add('on')
    const setI = (n) => { rows[i].classList.remove('on'); i = n; rows[i].classList.add('on') }
    let run = 0
    const hold = async (dir) => { const me = ++run; for (let k = 0; k < 7; k++) { if (me !== run) return; const n = Math.max(0, Math.min(7, i + dir)); if (n === i) return; setI(n); await sleep(33) } }
    return { 'Hold ↓': () => hold(1), 'Hold ↑': () => hold(-1) }
  }
})

const WARN_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4"/><path d="M12 17.5v.01"/></svg>`
def({
  id: 'warn', group: 'Fix', title: 'Context warning glyph · tab switch', h: 70,
  actions: ['Cross threshold', 'Switch tab and back'],
  build(side, stage) {
    const wrap = $(`<div style="position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:10px"></div>`)
    stage.appendChild(wrap)
    const mount = (fresh) => {

    return {
      'Cross threshold': async () => { wrap.innerHTML = ''; await sleep(250); mount(true) },

})

/* prose arrival */
const PROSE = 'The sidebar keeps its rows in the order you last sent a message, so opening or restoring a session never moves it. When a new turn starts, the row rises to the top of its group, and a pinned row stays where you put it until you unpin it. Hidden projects collect at the bottom of the list behind a single row that shows how many there are.'
function chunks(text) { let s = 7, out = [], i = 0; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647; while (i < text.length) { const n = 2 + Math.floor(rnd() * 9); out.push(text.slice(i, i + n)); i += n } return out }
const PROSE_CHUNKS = chunks(PROSE)
const splitParts = (s) => s.split(/(\s+)/).filter(x => x !== '')
let proseRate = 16
def({
  id: 'prose', group: 'Needs a live look', title: 'Streaming prose · word fade', h: 190,
  actions: ['Stream'], rates: [16, 50, 120],
  build(side, stage) {
    const p = $(`<div class="prose"></div>`)
    stage.appendChild(p)
    let run = 0
    // current: React keyless reconciliation of [settled text, (ws text | word span)*]
    const renderCur = (content, from) => {
      const settled = content.slice(0, from), arriving = content.slice(from)
      const next = [{ t: 'text', v: settled }]
      for (const part of splitParts(arriving)) next.push(/^\s+$/.test(part) ? { t: 'text', v: part } : { t: 'span', v: part })
      const kids = Array.from(p.childNodes)
      next.forEach((n, k) => {
        const old = kids[k]
        const same = old && ((n.t === 'text' && old.nodeType === 3) || (n.t === 'span' && old.nodeType === 1))
        if (same) { if (n.t === 'text') old.nodeValue = n.v; else old.textContent = n.v }
        else { const node = n.t === 'text' ? document.createTextNode(n.v) : Object.assign(document.createElement('span'), { className: 'prose-arrive-smooth', textContent: n.v }); if (old) p.replaceChild(node, old); else p.appendChild(node) }
      })
      for (let k = kids.length - 1; k >= next.length; k--) p.removeChild(kids[k])
    }
    return {
      'Stream': async () => {
        const me = ++run; p.innerHTML = ''
        let content = ''
        if (side === 'cur') {
          for (const c of PROSE_CHUNKS) { if (me !== run) return; const from = content.length; content += c; renderCur(content, from); await sleep(proseRate) }
          renderCur(content, content.length)
        } else {
          const settled = document.createTextNode(''); p.appendChild(settled)
          const live = [] // {node, at}
          let pendingWord = null
          const age = () => { const now = performance.now(); while (live.length && now - live[0].at > 220) { const x = live.shift(); if (x.node === pendingWord) pendingWord = null; settled.nodeValue += x.node.textContent; x.node.remove() } }
          for (const c of PROSE_CHUNKS) {
            if (me !== run) return
            const now = performance.now()
            for (const part of c.split(/(\s+)/).filter(x => x !== '')) {
              if (/^\s+$/.test(part)) { pendingWord = null; const t = document.createTextNode(part); p.appendChild(t); live.push({ node: t, at: now }) }
              else if (pendingWord) { pendingWord.textContent += part }
              else { const s = document.createElement('span'); s.className = 'prose-arrive-smooth'; s.textContent = part; p.appendChild(s); pendingWord = s; live.push({ node: s, at: now }) }
            }
            age(); await sleep(proseRate)
          }
          while (live.length) { if (me !== run) return; age(); await sleep(30) }
        }
      }
    }
  }
})

const FAM = { bash: ['$', 'Bash', '#a3e635'], read: ['≡', 'Read', '#60a5fa'], grep: ['⌕', 'Search', '#fbbf24'], edit: ['±', 'Edit', 'var(--accent)'] }

const LT_BYLINE = `<div class="byline"><span class="dots"><span class="dot pulse" style="background:var(--accent)"></span><span class="dot pulse" style="background:var(--accent);animation-delay:150ms"></span><span class="dot pulse" style="background:var(--accent);animation-delay:300ms"></span></span><span class="v"></span><span class="tg"></span><span class="clk"></span></div>`

/* One pane. CURRENT and PROPOSED share every call; `pro` only adds the proposed motion. */
function ltView(stage, pro, dock = false) {
  const root = $(`<div class="lt"><div class="lt-scroll"><div class="lt-col"></div></div>${dock ? '<div class="lt-dock"><div class="byslot"></div><div class="composer ph">Ask Cat Code anything or describe a task…</div></div>' : ''}</div>`)
  stage.appendChild(root)
  const scroll = root.querySelector('.lt-scroll'), col = root.querySelector('.lt-col'), slot = root.querySelector('.byslot')
  const born = new Map()
  let clock = 0, t0 = 0
  const q = (k) => col.querySelector(`[data-k="${k}"]`)
  const arrive = (el, age = 0) => { if (!pro) return; el.classList.add(ARRIVE); if (age > 0) el.style.animationDelay = `-${Math.round(age)}ms` }
  const prep = (el) => { if (pro) el.querySelectorAll('.dot').forEach(d => d.classList.add('pro-t')); return el }
  return {
    scroll, col, q,
    add(html, live = true) { const el = prep($(html)); col.appendChild(el); if (live) { born.set(el.dataset.k, performance.now()); arrive(el) } return el },
    replace(oldK, html) {
      const old = q(oldK); if (!old) return null
      const el = prep($(html)); old.replaceWith(el)
      const b = born.get(oldK)
      if (b !== undefined) { born.set(el.dataset.k, b); const age = performance.now() - b; if (age < ARRIVE_MS) arrive(el, age) }
      return el
    },
    status(k, st) { const d = q(k)?.querySelector('.card-head > .dot'); if (!d) return; d.style.background = DOT_BG[st]; d.classList.toggle('pulse', st === 'pending') },
    grow(k, html) { const card = q(k)?.querySelector('.card'); if (!card) return; const el = $(html); card.appendChild(el); if (pro) el.classList.add(ARRIVE) },
    badge(k, html) { const d = q(k)?.querySelector('.card-head > .dot'); if (!d) return; const el = $(html); d.before(el); if (pro) el.classList.add(ARRIVE) },
    steps(k, steps) { const row = q(k); if (!row) return; row.innerHTML = ltSteps(steps); if (pro) row.querySelector(`[data-step="${steps.length - 1}"]`).classList.add(ARRIVE) },
    by(verb, target = null) {
      if (!slot) return
      if (!slot.firstElementChild) slot.appendChild($(LT_BYLINE))
      const b = slot.firstElementChild
      b.querySelector('.v').textContent = verb
      const tg = b.querySelector('.tg'); tg.textContent = target ?? ''; tg.style.display = target ? '' : 'none'
      b.querySelector('.clk').textContent = fmtEl(t0 ? performance.now() - t0 : 0)
    },
    startClock() { clearInterval(clock); t0 = performance.now(); clock = setInterval(() => { const c = slot?.querySelector('.clk'); if (c) c.textContent = fmtEl(performance.now() - t0) }, 250) },
    endTurn() { clearInterval(clock); t0 = 0; if (slot) slot.innerHTML = '' },
    reset() { clearInterval(clock); t0 = 0; col.innerHTML = ''; born.clear(); if (slot) slot.innerHTML = ''; scroll.querySelector('.q-block')?.remove() },
    async remount() {
      root.style.visibility = 'hidden'
      await sleep(350)
      col.innerHTML = col.innerHTML
      col.querySelectorAll('.' + ARRIVE).forEach(n => { n.classList.remove(ARRIVE); n.style.animationDelay = '' })
      born.clear()
      root.style.visibility = ''
    },
  }
}

async function ltStream(v, alive) {
  v.add(`<div class="lt-row" data-k="ans"><div class="lt-prose"><p></p></div></div>`, false)
  for (const c of LT_ANSWER_CHUNKS) {
    if (!alive()) return false
    const s = document.createElement('span'); s.className = 'prose-arrive-smooth'; s.textContent = c
    v.q('ans')?.querySelector('p').appendChild(s)
    await sleep(80)
  }
  return alive()
}

def({
  id: 'ltturn', group: 'Live turn', title: 'Full turn', h: 460,
  actions: ['Play turn', 'Switch tab and back', 'Reset'],
  modes: { label: 'Gaps', values: ['Short', 'Real'], get: () => turnGaps, set: (x) => { turnGaps = x } },
  build(side, stage) {
    const v = ltView(stage, side === 'pro', true)
    let run = 0
    const idle = () => { v.reset(); v.add(ltUser('u1', LT_PROMPT), false) }
    idle()
    const play = async () => {
      const me = ++run
      const w = async (ms) => { await sleep(turnGap(ms)); return me === run }
      v.reset(); v.add(ltUser('u1', LT_PROMPT), false); v.startClock(); v.by('Working')
      if (!await w(4100)) return; v.add(ltLine('r1', LT_R1)); v.by('Thinking')
      if (!await w(1200)) return; v.add(ltCard('rd1', 'read', 'app/renderer/src/Sidebar.tsx')); v.by('Running', 'Read')
      if (!await w(10)) return; v.replace('rd1', ltRun('run1', 2)); v.add(ltCard('gr1', 'grep', 'lastActivityAt'))
      if (!await w(200)) return; v.status('run1', 'success'); v.by('Running', 'Grep')
      if (!await w(90)) return; v.status('gr1', 'success'); v.by('Working')
      if (!await w(8100)) return; v.add(ltLine('r2', LT_R2[0])); v.by('Thinking')
      if (!await w(350)) return; v.steps('r2', LT_R2)
      if (!await w(360)) return; v.add(ltCard('b1', 'bash', LT_CMD)); v.by('Running', 'Bash')
      if (!await w(4000)) return; v.status('b1', 'error'); v.grow('b1', ltErrBody(LT_FAIL)); v.by('Working')
      if (!await w(8100)) return; v.add(ltLine('r3', LT_R3)); v.by('Thinking')
      if (!await w(360)) return; v.add(ltCard('e1', 'edit', 'app/renderer/src/sidebarOrder.ts')); v.by('Running', 'Edit')
      if (!await w(180)) return; v.status('e1', 'success'); v.badge('e1', LT_DIFF); v.by('Working')
      if (!await w(6200)) return; v.add(ltCard('b2', 'bash', LT_CMD)); v.by('Running', 'Bash')
      if (!await w(4000)) return; v.status('b2', 'success'); v.grow('b2', ltBand(LT_PASS)); v.by('Working')
      if (!await w(7400)) return; v.by('Responding')
      if (!await ltStream(v, () => me === run)) return
      v.endTurn()
    }
    return { 'Play turn': play, 'Switch tab and back': () => v.remount(), 'Reset': () => { run++; idle() } }
  }
})

def({
  id: 'ltburst', group: 'Live turn', title: 'Tool burst', h: 270,
  actions: ['One commit', 'Split commit', 'Switch tab and back', 'Reset'],
  build(side, stage) {
    const v = ltView(stage, side === 'pro')
    let run = 0
    const base = () => { v.reset(); v.add(ltUser('u1', LT_PROMPT), false); v.add(ltLine('r1', LT_R1), false) }
    base()
    const burst = async (split) => {
      const me = ++run; base()
      const w = async (ms) => { await sleep(ms); return me === run }
      if (!await w(250)) return
      if (split) { v.add(ltCard('rd1', 'read', 'app/renderer/src/Sidebar.tsx')); if (!await w(10)) return; v.replace('rd1', ltRun('run1', 3)) }
      else v.add(ltRun('run1', 3))
      v.add(ltCard('gr1', 'grep', 'lastActivityAt')); v.add(ltCard('b1', 'bash', 'bun run --cwd app typecheck'))
      if (!await w(200)) return; v.status('run1', 'success')
      if (!await w(90)) return; v.status('gr1', 'success')
    }
    return { 'One commit': () => burst(false), 'Split commit': () => burst(true), 'Switch tab and back': () => v.remount(), 'Reset': () => { run++; base() } }
  }
})

def({
  id: 'ltresult', group: 'Live turn', title: 'Result lands', h: 250,
  actions: ['Passes', 'Fails', 'Reset'],
  build(side, stage) {
    const v = ltView(stage, side === 'pro')
    let run = 0
    const base = () => { v.reset(); v.add(ltLine('r1', LT_R2[1]), false); v.add(ltCard('b1', 'bash', LT_CMD), false) }
    base()
    const land = async (ok) => {
      const me = ++run; base(); await sleep(400); if (me !== run) return
      v.status('b1', ok ? 'success' : 'error')
      v.grow('b1', ok ? ltBand(LT_PASS) : ltErrBody(LT_FAIL))
    }
    return { 'Passes': () => land(true), 'Fails': () => land(false), 'Reset': () => { run++; base() } }
  }
})

def({
  id: 'ltagents', group: 'Live turn', title: 'Parallel workers · regroup', h: 300,
  actions: ['Spawn', 'Workers report', 'Reset'],
  build(side, stage) {
    const v = ltView(stage, side === 'pro')
    let run = 0
    const base = () => { v.reset(); v.add(ltUser('u1', LT_PROMPT), false); v.add(ltLine('r1', LT_R1), false) }
    base()
    return {
      'Spawn': async () => {
        const me = ++run; base(); await sleep(250); if (me !== run) return
        v.add(`<div class="lt-row" data-k="a1">${ltAgent(LT_WORKERS[0])}</div>`)
        await sleep(70); if (me !== run) return
        v.replace('a1', ltGroup('g1', LT_WORKERS))
      },
      'Workers report': () => {
        for (const w of LT_WORKERS) {
          const m = v.q('g1')?.querySelector(`[data-m="${w.id}"]`); if (!m) continue
          const n = m.querySelector('.ag-name'); n.classList.remove('nameless'); n.style.color = '#7dd3fc'; n.textContent = w.name
          m.querySelector('.ag-slot').textContent = w.act
          m.querySelector('.ag-model').textContent = 'GPT-6 Sol'
        }
      },
      'Reset': () => { run++; base() },
    }
  }
})

def({
  id: 'ltqueued', group: 'Live turn', title: 'Queued message · delivered', h: 300,
  actions: ['Engine takes it', 'Reset'],
  build(side, stage) {
    const pro = side === 'pro'
    const v = ltView(stage, pro, true)
    const Q = 'Also check the pinned rows'
    const base = () => {
      v.reset(); v.add(ltLine('r1', LT_R1), false); v.add(ltCard('gr1', 'grep', 'lastActivityAt'), false); v.status('gr1', 'success')
      v.scroll.appendChild($(`<div class="q-block"><div class="q-stack"><span class="q-cap">Queued</span><div class="ub queued">${esc(Q)}</div></div><div class="q-ctl"><span class="q-btn">${Q_ICON_SEND}</span><span class="q-btn">${Q_ICON_BACK}</span></div></div>`))
      v.startClock(); v.by('Working')
    }
    base()
    return {
      'Engine takes it': () => {
        const qb = v.scroll.querySelector('.q-block'); if (!qb) return
        qb.remove()
        const row = v.add(ltUser('u2', Q), false)
        if (pro) { const b = row.querySelector('.ub'); b.classList.add('queued'); void b.offsetWidth; b.classList.add('pro-t'); b.classList.remove('queued') }
      },
      'Reset': base,
    }
  }
})

def({
  id: 'permsubmit', group: 'Add', title: 'Permission card · after you answer', h: 310,
  actions: ['Approve', 'Approve · send fails', 'Reset'],
  build(side, stage) {
    const dock = $(`<div class="dock"><div class="slot-card"></div><div class="composer">Rename the helper and update its callers</div></div>`)
    const slot = dock.firstElementChild
    stage.appendChild(dock)
    let card = null, run = 0
    const show = () => { slot.innerHTML = ''; card = $(PERM_HTML); if (side === 'pro') card.classList.add('pro-t'); slot.appendChild(card) }
    show()
    const answer = async (fail) => {
      if (!card) return; const me = ++run
      card.querySelectorAll('button').forEach(b => b.disabled = true)
      if (side === 'pro') card.classList.add('dim')
      await sleep(900); if (me !== run) return
      if (fail) { card.querySelectorAll('button').forEach(b => b.disabled = false); card.classList.remove('dim') }
      else { slot.innerHTML = ''; card = null }
    }
    return { 'Approve': () => answer(false), 'Approve · send fails': () => answer(true), 'Reset': () => { run++; show() } }
  }
})

      'Open session': () => {
        sc.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); t.querySelector('.bar')?.remove() })
        const t = $(`<div class="tab active"><span class="bar"></span><span class="title">Motion audit</span></div>`)
        sc.appendChild(t)
        if (side === 'pro') { t.classList.add('p-tab-in'); t.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' }) }
      },
      'Reset': reset,
    }
  }
})

/* ============ DECISIONS ============ */

def({
  id: 'byline', group: 'Decide', title: 'Working line above the composer', h: 260, cols: ['Current', 'Fade only', 'Reserved space'],
  actions: ['Turn starts', 'Turn ends'],
  build(side, stage) {
    const pane = $(`<div class="pane"><div class="scroller"><p>The sidebar keeps its rows in the order you last sent a message, so opening or restoring a session never moves it.</p><p>When a new turn starts, the row rises to the top of its group, and a pinned row stays where you put it until you unpin it.</p></div><div class="byslot"></div><div class="composer">Rename the helper and update its callers</div></div>`)
    stage.appendChild(pane)
    const slot = pane.querySelector('.byslot')
    if (side === 2) slot.classList.add('slot')
    const BY = `<div class="byline"><span class="dots"><span class="dot pulse" style="background:var(--accent)"></span><span class="dot pulse" style="background:var(--accent);animation-delay:150ms"></span><span class="dot pulse" style="background:var(--accent);animation-delay:300ms"></span></span><span class="v">Responding</span><span class="tg">app/renderer/src/Sidebar.tsx</span><span class="el">12s</span></div>`
    let run = 0
    return {
      'Turn starts': () => { run++; slot.innerHTML = ''; const b = $(BY); if (side !== 0) b.classList.add('p-fade-in-180'); slot.appendChild(b) },
      'Turn ends': async () => { const me = ++run; const b = slot.firstElementChild; if (!b) return; if (side === 0) { b.remove(); return } b.classList.remove('p-fade-in-180'); b.classList.add('by-fade-out'); await sleep(120); if (me === run) b.remove() },
    }
  }
})

def({
  id: 'tasks', group: 'Decide', title: 'Tasks pill · background work running', h: 70, cols: ['Current', 'Static dot'],
  actions: [],
  build(side, stage) {
    stage.appendChild($(`<button class="tasks"><span class="dot ${side === 0 ? 'pulse' : ''}" style="background:var(--accent)"></span><span>2 background tasks</span></button>`))
    return {}
  }
})

/* ============ render ============ */
const nav = document.getElementById('x-nav'), root = document.getElementById('x-rows')
let lastGroup = null
for (const d of DEMOS) {
  if (d.group !== lastGroup) { lastGroup = d.group; root.appendChild($(`<div class="x-group">${d.group}</div>`)) }
  nav.appendChild($(`<a href="#${d.id}">${d.title}</a>`))
  const cols = d.cols || ['Current', 'Proposed']
  const row = $(`<section class="x-row" id="${d.id}"><div class="x-head"><span class="x-title">${d.title}</span></div><div class="x-grid ${cols.length === 3 ? 'x-three' : ''}"></div></section>`)
  const head = row.querySelector('.x-head'), grid = row.querySelector('.x-grid')
  const ctrls = cols.map((c, k) => {
    const col = $(`<div><div class="x-col-label">${c}</div><div class="x-stage s" style="height:${d.h}px"></div></div>`)
    grid.appendChild(col)
    const side = d.cols ? k : (k === 0 ? 'cur' : 'pro')
    return d.build(side, col.querySelector('.x-stage'))
  })
  if (d.hint) head.appendChild($(`<span>${d.hint}</span>`))
  for (const a of d.actions) { const b = $(`<button class="x-btn">${a}</button>`); b.onclick = () => ctrls.forEach(c => c[a] && c[a]()); head.appendChild(b) }
  if (d.rates) {
    head.appendChild($(`<span class="x-sep"></span>`)); head.appendChild($(`<span>Commit every</span>`))
    const btns = d.rates.map(r => { const b = $(`<button class="x-btn" aria-pressed="${r === proseRate}">${r}ms</button>`); b.onclick = () => { proseRate = r; btns.forEach(x => x.setAttribute('aria-pressed', String(x === b))) }; head.appendChild(b); return b })
  }
  if (d.modes) {
    const m = d.modes
    head.appendChild($(`<span class="x-sep"></span>`)); head.appendChild($(`<span>${m.label}</span>`))
    const btns = m.values.map(val => { const b = $(`<button class="x-btn" aria-pressed="${val === m.get()}">${val}</button>`); b.onclick = () => { m.set(val); btns.forEach(x => x.setAttribute('aria-pressed', String(x === b))) }; head.appendChild(b); return b })
  }
  root.appendChild(row)
}
</script>
</body>
</html>
