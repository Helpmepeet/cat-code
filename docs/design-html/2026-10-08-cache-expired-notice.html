<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cache expired notice</title>
<style>
@font-face { font-family: 'DM Sans'; font-weight: 100 1000; src: url('../../app/renderer/src/assets/fonts/DMSans-Variable.woff2') format('woff2'); }
@font-face { font-family: 'DM Mono'; font-weight: 400; src: url('../../app/renderer/src/assets/fonts/DMMono-Regular.woff2') format('woff2'); }

:root {
  --app-bg: #09090b;
  --surface-raised: #111113;
  --shell-seam: rgba(255, 255, 255, 0.06);
  --text-primary: #f4f4f5;
  --text-muted: #a1a1aa;
  --text-faint: #838389;
  --text-ghost: #75757b;
  --accent: #f472b6;
  --peer: #818cf8;
  --tone-warn: #fbbf24;
  --tone-good: #4ade80;
  --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --font-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--app-bg); color: var(--text-primary); }

/* ---------- chrome ---------- */
.x-bar { position: sticky; top: 0; z-index: 10; background: var(--app-bg); border-bottom: 1px solid #222; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; font: 10px/1 ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; color: #777; }
.x-group { display: flex; gap: 4px; align-items: center; }
.x-group > span { margin-right: 6px; }
.x-btn { font: inherit; letter-spacing: inherit; text-transform: inherit; color: #777; background: none; border: 1px solid #2a2a2a; padding: 5px 9px; cursor: pointer; }
.x-btn[aria-pressed="true"] { color: #ddd; border-color: #666; }
.x-label { max-width: 900px; margin: 40px auto 14px; padding: 0 32px; font: 10px/1 ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; color: #666; }
.x-end { height: 80px; }
.x-label.x-first { margin-top: 32px; }

/* ---------- specimen: transcript tail ---------- */
.col { margin: 0 auto; width: 100%; max-width: 900px; padding: 0 32px; display: flex; flex-direction: column; gap: 10px; font-family: var(--font-sans); }
.md-prose { font-weight: 500; font-size: 14px; line-height: 1.625; overflow-wrap: break-word; }
.md-prose > * + * { margin-top: 0.85em; }
.md-prose ul { padding-left: 1.5em; list-style-type: disc; }
.md-prose li::marker { color: var(--text-muted); }
.md-prose li + li { margin-top: 0.3em; }
.md-prose code { font-family: var(--font-mono); font-size: 0.92em; color: var(--accent); }
.bash { font-family: var(--font-mono); }
.bash-head { display: flex; align-items: center; gap: 10px; height: 22px; font-size: 11.5px; }
.bash-glyph { color: var(--tone-good); width: 12px; }
.bash-kind { color: #d9f99d; font-size: 10.5px; letter-spacing: .04em; }
.bash-cmd { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bash-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tone-good); flex: none; }
.bash-out { margin: 2px 0 0 22px; padding: 8px 12px; background: #141416; font-size: 11px; line-height: 1.6; color: var(--text-muted); white-space: pre; }

/* ---------- specimen: composer ---------- */
.dock { margin: 22px auto 0; width: 100%; max-width: 900px; padding: 0 32px; font-family: var(--font-sans); }
.field { display: flex; align-items: flex-end; gap: 14px; padding: 0 4px; }
.field-text { flex: 1; min-width: 0; padding: 6px 0; font-size: 15px; font-weight: 500; line-height: 1.5; color: var(--text-faint); }
.ph-name { color: var(--peer); }
.send { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--text-ghost); }

/* action rail (ComposerActionsBar) */
.rail { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 0; border-top: 1px solid rgba(255,255,255,.1); margin-top: 4px; }
.rail-l { display: flex; align-items: center; gap: 4px; }
.rail-r { margin-left: auto; display: flex; min-width: 0; align-items: center; gap: 7px; }
.face { display: inline-flex; align-items: center; white-space: nowrap; border-radius: 6px; padding: 3px 5px; font-size: 12.5px; font-weight: 500; }
.sep { font-size: 12px; color: rgba(255,255,255,.2); user-select: none; }
.f-plus { color: var(--text-ghost); font-size: 16px; margin-right: 6px; }
.f-model { color: #22d3ee; }
.f-acc { color: var(--accent); }
.f-account { gap: 6px; color: var(--text-muted); }
.f-account i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.warn-face { position: relative; display: flex; width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 5px; color: var(--tone-warn); flex: none; }
.gauge { gap: 6px; color: var(--accent); }
.gauge b { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.gauge.low { color: var(--tone-warn); }

/* hover label (POPOVER_PANEL surface) */
.tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; border-radius: 8px; border: 1px solid var(--shell-seam); background: var(--surface-raised); box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1); padding: 5px 9px; font: 500 11.5px var(--font-sans); color: var(--text-primary); }

/* ---------- switching ---------- */
#stage.warm .cache { display: none; }
#stage:not(.hover) .tip { display: none; }
#stage:not(.low) .low-only { display: none; }
#stage.low .normal-only { display: none; }
</style>
</head>
<body>

<div class="x-bar">
  <div class="x-group"><span>State</span>
    <button class="x-btn" data-s="warm" aria-pressed="false">Warm</button>
    <button class="x-btn" data-s="" aria-pressed="true">Expired</button>
    <button class="x-btn" data-s="hover" aria-pressed="false">Expired, hover</button>
    <button class="x-btn" data-s="low" aria-pressed="false">Expired, context low</button>
  </div>
</div>

<main id="stage" class="">


<div id="variants"></div>
<template id="composer">
<div class="dock">
  <div class="field">
    <div class="field-text">Ask <span class="ph-name">Breccia</span> anything or describe a task…</div>
    <span class="send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></span>
  </div>
  <div class="rail">
    <div class="rail-l"><span class="f-plus">+</span><span class="face f-model">GPT-6.1 Sol</span><span class="sep">·</span><span class="face f-acc">High</span><span class="sep">·</span><span class="face f-acc">Auto</span></div>
    <div class="rail-r">
      <!-- cache expired face -->
      <span class="warn-face cache" role="status" aria-label="Cache expired">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ICON}}</svg>
        <span class="tip">Cache expired</span>
      </span>
      <span class="face f-account"><i></i>main</span>
      <span class="sep">·</span>
      <span class="face gauge normal-only"><svg width="16" height="16" viewBox="0 0 16 16" style="transform:rotate(-90deg)" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="7.5 37.7"/></svg><b>20%</b></span>
      <span class="face gauge low low-only"><svg width="16" height="16" viewBox="0 0 16 16" style="transform:rotate(-90deg)" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="32.8 37.7"/></svg><b>87%</b></span>
    </div>
  </div>
</div>
</template>

<div class="x-end"></div>
</main>

<script>
const ICONS = [
  ['C', 'Clock', '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'],
];
const tpl = document.getElementById('composer').innerHTML;
document.getElementById('variants').innerHTML = ICONS.map(([k, name, icon], i) =>
  '<div class="x-label x-first">Composer</div>' + tpl.replace('{{ICON}}', icon)
).join('');
const stage = document.getElementById('stage');
document.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-s]').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
  stage.className = b.dataset.s;
}));
</script>
</body>
</html>
