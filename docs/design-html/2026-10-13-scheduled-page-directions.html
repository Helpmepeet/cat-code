<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheduled page directions</title>
<style>
@font-face { font-family: 'DM Sans'; font-weight: 100 1000; src: url('../../app/renderer/src/assets/fonts/DMSans-Variable.woff2') format('woff2'); }
@font-face { font-family: 'DM Mono'; font-weight: 400; src: url('../../app/renderer/src/assets/fonts/DMMono-Regular.woff2') format('woff2'); }
@font-face { font-family: 'DM Mono'; font-weight: 500; src: url('../../app/renderer/src/assets/fonts/DMMono-Medium.woff2') format('woff2'); }

/* ---------- chrome (x-) ---------- */
html, body { margin: 0; background: #1d1d1f; }
.x-bar { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: center; padding: 12px 24px; background: #1d1d1f; border-bottom: 1px solid #333336; font: 500 9.5px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; color: #8d8d92; }
.x-group { display: flex; gap: 10px; align-items: center; }
.x-opt { all: unset; cursor: pointer; padding: 2px 0; color: #6d6d72; border-bottom: 1px solid transparent; }
.x-opt[aria-pressed="true"] { color: #d4d4d8; border-bottom-color: #8d8d92; }
.x-opt:focus-visible { outline: 1px dotted #8d8d92; outline-offset: 3px; }
.x-variant { padding: 26px 24px 40px; }
.x-label { font: 500 9.5px/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: #8d8d92; margin: 0 0 10px; }

/* ---------- specimen tokens (theme.css) ---------- */
.spec {
  --app-bg: #09090b; --chrome: #070709; --raised: #111113; --panel: #0a0a0c;
  --seam: rgba(255,255,255,.06); --hover: rgba(255,255,255,.045); --active: rgba(255,255,255,.06);
  --t1: #f4f4f5; --t2: #a1a1aa; --t3: #98989f; --t4: #838389; --t5: #75757b;
  --wash: 255,255,255; --on-fill: #09090b;
  --good: #4ade80; --warn: #fbbf24; --danger: #f87171; --info: #60a5fa;
  --accent: #f472b6; --accent-soft: #f9a8d4;
  --elev-menu: 0 18px 44px rgba(0,0,0,.6);
  position: relative; overflow: hidden; height: 760px; background: var(--app-bg); color: var(--t1);
  font: 400 13px/1.45 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; color-scheme: dark;
}
.spec[data-accent="blue"] { --accent: #60a5fa; --accent-soft: #93c5fd; }
.spec.light {
  --app-bg: #fcfcfd; --chrome: #f1f1f4; --raised: #ffffff; --panel: #f7f7f9;
  --seam: rgba(9,9,11,.1); --hover: rgba(9,9,11,.04); --active: rgba(9,9,11,.065);
  --t1: #18181b; --t2: #52525b; --t3: #575761; --t4: #6a6a74; --t5: #767680;
  --wash: 24,24,27; --on-fill: #fff;
  --good: #15803d; --warn: #a35f00; --danger: #dc2626; --info: #2563eb;
  --accent: #bb3e84; --accent-soft: #ad3078;
  --elev-menu: 0 12px 32px rgba(24,24,27,.13), 0 2px 6px rgba(24,24,27,.09);
  color-scheme: light;
}
.spec.light[data-accent="blue"] { --accent: #2563eb; --accent-soft: #1d4ed8; }
.spec * { box-sizing: border-box; }
.spec button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.spec .mono { font-family: 'DM Mono', ui-monospace, monospace; }

/* layout */
.spec .layout { position: absolute; inset: 0; display: grid; grid-template-columns: 272px minmax(0, 1fr); }
.spec.narrow .layout { grid-template-columns: minmax(0, 1fr); }

/* list panel */
.spec .lp { overflow-y: auto; padding: 18px 10px 24px; background: var(--chrome); border-right: 1px solid var(--seam); }
.spec .lp-title { padding: 0 10px; margin-bottom: 10px; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.spec .li { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; }
.spec .li.sel { background: var(--active); }
.spec .li.new { color: var(--t2); font-size: 13px; }
.spec .li.new svg { color: var(--t3); }
.spec .li .main { min-width: 0; flex: 1; }
.spec .li .n { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--t1); }
.spec .li .n span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.spec .li .n svg { flex: none; color: var(--t3); }
.spec .li.off .n { color: var(--t2); }
.spec .li .s { margin-top: 1px; font-size: 11.5px; color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spec .li .s.warn { color: var(--warn); }
.spec .li .cnt { font: 11px 'DM Mono', monospace; color: var(--t3); }
.spec .lcap { margin: 18px 10px 3px; font-size: 11.5px; font-weight: 500; color: var(--t3); }
.spec .lsep { height: 1px; margin: 14px 10px; background: var(--seam); }

/* dots */
.spec .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; }
.spec .dot.warn { background: var(--warn); } .spec .dot.info { background: var(--info); } .spec .dot.good { background: var(--good); }
.spec .dot.danger { background: var(--danger); } .spec .dot.n { background: var(--t4); }
.spec .dot.ring { box-shadow: inset 0 0 0 1.5px var(--t4); }

/* main pane */
.spec .mp { position: relative; overflow-y: auto; padding: 30px 40px 60px; }
.spec.narrow .mp { padding: 18px 16px 48px; }
.spec .mi { max-width: 680px; }
.spec .back { display: inline-flex; align-items: center; gap: 4px; margin-bottom: 14px; font-size: 12.5px; color: var(--t3); }
.spec .dh { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 16px; }
.spec .dh .tt { min-width: 0; }
.spec h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
.spec .when { margin-top: 3px; font-size: 12.5px; color: var(--t3); }
.spec .when .mono { font-size: 12px; color: var(--t2); }
.spec .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.spec .btn-new { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 13px; white-space: nowrap; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--accent); font-size: 13px; font-weight: 500; }
.spec .btn-new.dis { opacity: .4; }
.spec .btn { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--seam); font-size: 12.5px; font-weight: 500; color: var(--t1); white-space: nowrap; }
.spec .more { display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center; border-radius: 8px; color: var(--t3); }
.spec .btn-fill { display: inline-flex; align-items: center; height: 32px; padding: 0 15px; border-radius: 8px; background: var(--accent); color: var(--on-fill); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.spec .btn-sec { display: inline-flex; align-items: center; height: 32px; padding: 0 15px; border-radius: 8px; border: 1px solid var(--seam); color: var(--t2); font-size: 12.5px; font-weight: 600; white-space: nowrap; }

/* current-run callout */
.spec .now { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 10px 10px 10px 14px; border-radius: 10px; border: 1px solid rgba(var(--wash), .06); background: rgba(var(--wash), .015); font-size: 12.5px; }
.spec .now.warn { border-color: color-mix(in srgb, var(--warn) 25%, transparent); background: color-mix(in srgb, var(--warn) 6%, transparent); }
.spec .now .main { flex: 1; min-width: 0; }
.spec .now .main b { font-weight: 500; color: var(--t1); }
.spec .now .main span { color: var(--t3); }
.spec .note { margin-top: 18px; padding: 10px 14px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); background: color-mix(in srgb, var(--warn) 6%, transparent); font-size: 12.5px; color: var(--t1); }
.spec .note span { color: var(--t3); }

/* sections */
.spec .sec { margin-top: 28px; }
.spec .cap { margin-bottom: 8px; font-size: 11.5px; font-weight: 500; color: var(--t3); }
.spec .prompt { font-size: 13px; line-height: 1.6; color: var(--t2); white-space: pre-wrap; }
.spec .dl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 12px; font-size: 12.5px; }
.spec .dl dt { color: var(--t3); }
.spec .dl dd { margin: 0; color: var(--t1); }
.spec.narrow .dl { grid-template-columns: 100px minmax(0, 1fr); }

/* run list */
.spec .runs { border-top: 1px solid var(--seam); }
.spec .run { display: grid; grid-template-columns: 7px minmax(0, 1fr) auto 14px; column-gap: 12px; align-items: baseline; padding: 10px 4px 10px 6px; border-bottom: 1px solid var(--seam); }
.spec .run .dot { transform: translateY(-1px); }
.spec .run .l1 { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; min-width: 0; }
.spec .run .l1 .tn { font-size: 12.5px; font-weight: 500; color: var(--t1); }
.spec .run .l1 .tn.gone { color: var(--t2); }
.spec .run .l1 .tm { font: 12px 'DM Mono', monospace; color: var(--t2); }
.spec .run .st { font-size: 11.5px; }
.spec .st.warn { color: var(--warn); } .spec .st.info { color: var(--info); } .spec .st.good { color: var(--good); } .spec .st.danger { color: var(--danger); } .spec .st.n { color: var(--t3); }
.spec .run .r { font: 11px 'DM Mono', monospace; color: var(--t3); white-space: nowrap; }
.spec .run .chev { color: var(--t4); align-self: center; display: flex; }
.spec .run .sum { grid-column: 2 / 4; margin-top: 3px; font-size: 12px; color: var(--t2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.spec .tag { display: inline-flex; align-items: center; height: 16px; padding: 0 6px; border-radius: 4px; border: 1px solid rgba(var(--wash), .08); font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--t3); }

/* empty prompt */
.spec .center { display: flex; min-height: 100%; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 40px; }
.spec .center .ico { color: var(--t3); margin-bottom: 14px; }
.spec .center .h { font-size: 15px; font-weight: 600; }
.spec .center .p { margin-top: 4px; max-width: 340px; font-size: 13px; color: var(--t3); }
.spec .center .acts { margin-top: 18px; justify-content: center; }

/* form */
.spec .fsec { margin-top: 22px; }
.spec .fsec > .cap { margin-bottom: 10px; }
.spec .fld { margin-bottom: 12px; }
.spec .fld > label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 500; color: var(--t2); }
.spec .in { display: flex; align-items: center; width: 100%; height: 33px; padding: 0 9px; border-radius: 5px; border: 1px solid var(--seam); background: var(--raised); font-size: 12.5px; color: var(--t1); }
.spec .in.focus { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.spec .in.sel { justify-content: space-between; }
.spec .in.sel svg { color: var(--t3); }
.spec .ta { height: auto; min-height: 128px; align-items: flex-start; padding: 8px 9px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
.spec .hint { margin-top: 5px; font-size: 11.5px; color: var(--t3); }
.spec .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 12px; }
.spec .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.spec .seg span { padding: 6px 12px; border-radius: 999px; font-size: 12px; color: var(--t3); }
.spec .seg span.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.spec .pair { display: flex; gap: 8px; }
.spec .pair .in { flex: 1; min-width: 0; }
.spec .preview { margin-top: 2px; font-size: 12px; color: var(--t3); }
.spec .preview .mono { color: var(--t1); }
.spec .ff { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--seam); }

/* menu */
.spec .menu { position: absolute; z-index: 20; width: 232px; padding: 6px; border-radius: 11px; border: 1px solid var(--seam); background: var(--chrome); box-shadow: var(--elev-menu); }
.spec .menu .m { display: block; width: 100%; padding: 6px 10px; border-radius: 6px; font-size: 12.5px; color: var(--t2); }
.spec .menu .m.focus { background: rgba(var(--wash), .05); color: var(--t1); }
.spec .menu .m.danger { color: var(--danger); }
.spec .menu .sep { height: 1px; margin: 4px 0; background: var(--seam); }

/* task pane hierarchy */
.spec h2 { font-size: 20px; }
.spec .meta2 { margin-top: 4px; font-size: 13px; color: var(--t3); }
.spec .sec2 { margin-top: 30px; }
.spec h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--t1); }
.spec .tl { display: flex; flex-direction: column; }
.spec .tr { display: grid; grid-template-columns: 7px minmax(0, 1fr) auto 14px; column-gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--seam); }
.spec .tr:last-child { border-bottom: 0; }
.spec .tr .tm2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; }
.spec .tr .tn { font-size: 13px; font-weight: 500; color: var(--t1); font-variant-numeric: tabular-nums; }
.spec .tr .tn.gone { color: var(--t2); }
.spec .tr .st { font-size: 12.5px; }
.spec .tr .r { font-size: 12px; color: var(--t3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.spec .tr .chev { color: var(--t4); display: flex; }
.spec .tr .sum { grid-column: 2 / 4; margin-top: 3px; font-size: 12.5px; line-height: 1.5; color: var(--t2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.spec .tr.next .tn { color: var(--t2); font-weight: 400; }
.spec .tr.live { grid-template-columns: 7px minmax(0, 1fr) auto; margin: 4px -12px; padding: 9px 9px 9px 12px; border: 1px solid rgba(var(--wash), .06); border-radius: 10px; background: rgba(var(--wash), .015); }
.spec .tr.live.warn { border-color: color-mix(in srgb, var(--warn) 25%, transparent); background: color-mix(in srgb, var(--warn) 6%, transparent); }
.spec .tr.live + .tr, .spec .tr:has(+ .tr.live) { border-bottom: 0; }
.spec .dot.hollow { box-shadow: inset 0 0 0 1.5px var(--t5); }
.spec .none { padding: 10px 0; font-size: 12.5px; color: var(--t3); }
.spec .quote { padding: 2px 0 2px 12px; border-left: 2px solid var(--seam); font-size: 13px; line-height: 1.6; color: var(--t2); white-space: pre-wrap; }
.spec .caution { margin-top: 10px; font-size: 12.5px; color: var(--warn); }
.spec .btn.ghost { border-color: transparent; color: var(--t2); }
.spec .btn.dis { color: var(--t5); }
.spec .vsep { width: 1px; height: 18px; margin: 0 4px; background: var(--seam); }
.spec .sw-wrap { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--t2); }
.spec .sw { position: relative; display: inline-flex; width: 31px; height: 18px; border-radius: 999px; border: 1px solid var(--seam); background: var(--hover); }
.spec .sw span { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--t3); }
.spec .sw.on { border-color: var(--accent); background: var(--accent); }
.spec .sw.on span { left: 16px; background: var(--on-fill); }
.spec:not(.narrow) .dh { flex-wrap: nowrap; }
.spec .dh .tt { flex: 1; }
.spec .dh .acts { flex: none; }
.spec.narrow .dh .acts { width: 100%; }
</style>
</head>

<div class="x-bar">
  <div class="x-group">Appearance <button class="x-opt" data-k="appearance" data-v="dark">Dark</button><button class="x-opt" data-k="appearance" data-v="light">Light</button></div>

<script>
const S = { appearance: 'dark', accent: 'pink', width: 'wide', pane: 'prompt', state: 'start' }

const I = {
  plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  plus11: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  more: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>',
  chevR: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chevD: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  back: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="m15 6-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  clock: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  clock14: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
}

const TASKS = {
  triage: { name: 'Triage flaky tests', next: 'After current run', rec: 'Every 90 min', project: 'cat-code', model: 'Default', effort: 'Default', perm: 'Auto', on: true, active: 'waiting', since: '13:08',
    prompt: 'Rerun the tests that failed in CI today.\nGroup failures by likely cause and say which ones look flaky rather than broken.' },
  nightly: { name: 'Nightly dependency review', next: 'Tomorrow 02:30', rec: 'Daily at 02:30', project: 'cat-code', model: 'gpt-6-sol', effort: 'High', perm: 'Ask', on: true, active: 'starting', since: '13:17',
    prompt: 'Review dependency changes merged since the last run.\nList packages that moved a major version and any published advisories that apply. Do not edit files.' },
  weekly: { name: 'Weekly changelog draft', next: 'Mon 09:00', rec: 'Mondays at 09:00', project: 'docs-site', model: 'Default', effort: 'Default', perm: 'Ask', on: true,
    prompt: 'Draft a changelog entry from this week\'s merged pull requests.' },
  maps: { name: 'Refresh workspace maps', next: 'Paused', rec: 'Daily at 03:00', project: 'cat-code', model: 'Default', effort: 'Default', perm: 'Auto', on: false, preset: true,
    prompt: 'Refresh docs/maps/ end to end in this project without check-ins. Edit only docs/maps/*.md.\nThe refresh helper owns its state and commits reviewed map changes.' },
}
const RUNS = [
  { task: 'Triage flaky tests', key: 'triage', st: 'waiting', when: 'Today 13:08' },
  { task: 'Nightly dependency review', key: 'nightly', st: 'starting', when: 'Today 13:17', sum: 'Waiting for room for another chat' },
  { task: 'Nightly dependency review', key: 'nightly', st: 'completed', when: 'Yesterday 02:30', dur: '21 min', sum: 'Reviewed 14 dependency changes. Two packages moved major versions; no published advisories apply to the versions in the lockfile.' },
  { task: 'Triage flaky tests', key: 'triage', st: 'failed', when: 'Sun 11:30', dur: '40s', sum: 'The scheduled prompt was refused. Open the chat to check workspace trust or permissions.' },
  { task: 'Nightly dependency review', key: 'nightly', st: 'completed', when: 'Sun 02:30', dur: '18 min', sum: 'No dependency changes since the previous run.' },
  { task: 'Release notes draft', key: null, st: 'interrupted', when: 'Thu, Oct 8 16:18', dur: '30s', sum: 'Cat Code closed before this run finished.' },
]
const ST = { waiting: ['warn', 'Needs answer'], starting: ['ring', 'Starting'], running: ['info', 'Running'], completed: ['good', 'Turn completed'], failed: ['danger', 'Failed'], interrupted: ['n', 'Interrupted'] }

/* ---------- list panel ---------- */
function listItem(key, sel) {
  const t = TASKS[key]
  const lead = t.active === 'waiting' ? '<span class="dot warn"></span>' : t.active === 'starting' ? '<span class="dot ring"></span>' : '<span class="dot" style="visibility:hidden"></span>'
  const s = t.active === 'waiting' ? `<div class="s warn">Needs answer · ${t.rec}</div>` : `<div class="s">${t.on ? `${t.next} · ` : ''}${t.rec}</div>`
  return `<button class="li ${sel ? 'sel' : ''} ${t.on ? '' : 'off'}"><div class="main"><div class="n"><span>${t.name}</span>${sel ? I.chevR : ''}</div>${s}</div>${lead}</button>`
}
function listPanel(sel) {
  if (S.state === 'empty') {
    return `<nav class="lp"><div class="lp-title">Scheduled</div><button class="li new ${sel === 'new' ? 'sel' : ''}">${I.plus}<span>New task</span></button>
      <div class="lcap">Suggested</div><button class="li"><div class="main"><div class="n"><span>Workspace-map refresh</span></div><div class="s">Daily at 03:00 · starts paused</div></div></button></nav>`
  }
  return `<nav class="lp"><div class="lp-title">Scheduled</div>
    <button class="li new ${sel === 'new' ? 'sel' : ''}">${I.plus}<span>New task</span></button>
    <div class="lcap">Upcoming</div>${['triage', 'nightly', 'weekly'].map(k => listItem(k, sel === k)).join('')}
    <div class="lcap">Paused</div>${listItem('maps', sel === 'maps')}
    <div class="lsep"></div>
    <button class="li ${sel === 'history' ? 'sel' : ''}"><div class="main"><div class="n"><span>Run history</span></div></div><span class="cnt">6</span></button>
  </nav>`
}

/* ---------- main pane pieces ---------- */
function runRows(runs, showTask) {
  return `<div class="tl">${runs.map(r => `<div class="tr"><span class="dot ${ST[r.st][0]}"></span><div class="tm2">${showTask ? `<span class="tn ${r.key ? '' : 'gone'}">${r.task}</span>${r.key ? '' : '<span class="tag">Deleted</span>'}` : `<span class="tn">${r.when}</span>`}<span class="st ${ST[r.st][0]}">${ST[r.st][1]}</span></div><span class="r">${[showTask ? r.when : '', r.dur].filter(Boolean).join(' · ')}</span><span class="chev">${I.chevR}</span>${r.sum ? `<div class="sum">${r.sum}</div>` : ''}</div>`).join('')}</div>`
}
function back() { return S.width === 'narrow' ? `<button class="back">${I.back} Scheduled</button>` : '' }
function taskPane(key, menuOpen) {
  const t = TASKS[key]
  const past = RUNS.filter(r => r.key === key && !['waiting', 'starting'].includes(r.st))
  const meta = [t.rec, t.project, t.perm === 'Auto' ? 'Auto permissions' : 'Asks for permission', ...(t.model !== 'Default' ? [`${t.model}, ${t.effort.toLowerCase()} effort`] : [])].join(' · ')
  const upcoming = !t.on ? '' : `<div class="tr next"><span class="dot hollow"></span><div class="tm2"><span class="tn">${t.active ? 'Next run' : t.next}</span><span class="st n">${t.active ? 'after this one finishes' : 'Scheduled'}</span></div></div>`
  const current = t.active === 'waiting'
    ? `<div class="tr live warn"><span class="dot warn"></span><div class="tm2"><span class="tn">Waiting for your answer</span><span class="st n">since ${t.since}</span></div><button class="btn">Answer in chat</button></div>`
    : t.active === 'starting'
      ? `<div class="tr live"><span class="dot ring"></span><div class="tm2"><span class="tn">Starting</span><span class="st n">waiting for room for another chat</span></div><button class="btn">Open chat</button></div>`
      : ''
  const pastRows = runRows(past, false).replace('<div class="tl">', '').replace(/<\/div>$/, '')
  const note = t.preset && !t.on ? '<div class="caution">Pause the previous map-refresh schedule outside Cat Code before turning this on.</div>' : ''
  const sw = `<span class="sw-wrap"><span class="sw-label">${t.on ? 'Active' : 'Paused'}</span><span class="sw ${t.on ? 'on' : ''}" role="switch" aria-checked="${t.on}"><span></span></span></span>`
  const acts = `<div class="acts">${sw}<span class="vsep"></span><button class="btn ${t.active ? 'dis' : ''}">Run now</button><button class="btn ghost">Edit</button><button class="more" aria-label="More" ${menuOpen ? 'data-anchor style="background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)"' : ''}>${I.more}</button></div>`
  const empty = !upcoming && !current && past.length === 0 ? '<div class="none">No runs yet</div>' : ''
  return `<div class="mi">${back()}
    <div class="dh"><div class="tt"><h2>${t.name}</h2><div class="meta2">${meta}</div></div>${acts}</div>
    ${note}
    <div class="sec2"><h3>Runs</h3><div class="tl">${upcoming}${current}${pastRows}${empty}</div></div>
    <div class="sec2"><h3>Instructions</h3><div class="quote">${t.prompt}</div></div>
  </div>${menuOpen ? '<div class="menu"><button class="m focus">Open last chat</button><div class="sep"></div><button class="m danger">Delete</button></div>' : ''}`
}
function promptPane(empty) {
  return `<div class="center"><span class="ico">${I.clock}</span><div class="h">Schedule a task</div><div class="p">Each run starts a new chat at the time you set, while Cat Code is open.</div><div class="acts"><button class="btn-new">${I.plus11} New task</button>${empty ? '<button class="btn">Add workspace-map refresh</button>' : ''}</div></div>`
}
function activityPane() {
  const active = RUNS.filter(r => ['waiting', 'starting'].includes(r.st))
  return `<div class="mi">${back()}<div class="dh"><div class="tt"><h2>Activity</h2><div class="when">Runs while Cat Code is open</div></div></div>
    <div class="now warn"><span class="dot warn"></span><div class="main"><b>Triage flaky tests</b> <span>is waiting for your answer · 13:08</span></div><button class="btn">Answer in chat</button></div>
    <div class="now" style="margin-top:6px"><span class="dot ring"></span><div class="main"><b>Nightly dependency review</b> <span>is starting · waiting for room for another chat</span></div><button class="btn">Open chat</button></div>
    <div class="sec"><div class="cap">Recent runs</div>${runRows(RUNS.filter(r => !active.includes(r)).slice(0, 4), true)}</div></div>`
}
function historyPane() {
  const done = RUNS.filter(r => !['waiting', 'starting'].includes(r.st))
  return `<div class="mi">${back()}<div class="dh"><div class="tt"><h2>Run history</h2><div class="when">${done.length} finished runs, including deleted tasks</div></div><div class="acts"><button class="btn">All tasks ${I.chevD}</button></div></div><div class="sec" style="margin-top:20px">${runRows(done, true)}</div></div>`
}
function newPane() {
  return `<div class="mi">${back()}<div class="dh"><div class="tt"><h2>New task</h2></div></div>
  <div class="fsec"><div class="fld"><label>Name</label><div class="in focus">Nightly dependency review</div></div>
    <div class="fld"><label>Instructions</label><div class="in ta">Review dependency changes merged since the last run.
List packages that moved a major version and any published advisories that apply. Do not edit files.</div></div></div>
  <div class="fsec"><div class="cap">Where</div><div class="pair"><div class="in sel"><span>cat-code <span class="mono" style="color:var(--t3);font-size:11px">~/cat-code</span></span>${I.chevD}</div><button class="btn-sec" style="height:33px">Choose folder…</button></div></div>
  <div class="fsec"><div class="cap">When</div><div class="seg"><span class="on">Every day</span><span>Weekdays</span><span>Weekly</span><span>Interval</span></div>
    <div class="grid2" style="margin-top:10px"><div class="fld"><label>Time</label><div class="in mono">02:30</div></div><div class="fld"><label>Time zone</label><div class="in mono">Asia/Bangkok</div></div></div>
    <div class="preview">Next run <span class="mono">Tomorrow 02:30</span></div></div>
  <div class="fsec"><div class="cap">Runs with</div><div class="grid2"><div class="fld"><label>Model</label><div class="in mono">gpt-6-sol</div></div><div class="fld"><label>Effort</label><div class="in sel"><span>High</span>${I.chevD}</div></div></div>
    <div class="fld"><label>Permissions</label><div class="seg"><span class="on">Ask</span><span>Auto</span></div><div class="hint">Requests wait in the run's chat until you answer.</div></div></div>
  <div class="ff"><button class="btn-sec">Cancel</button><button class="btn-fill">Create task</button></div></div>`
}

/* ---------- compose ---------- */
function render() {
  const st = S.state, narrow = S.width === 'narrow'
  let sel = null, main = ''
  if (st === 'start') {
    if (S.pane === 'prompt') main = promptPane(false)
    else if (S.pane === 'activity') main = activityPane()
    else { sel = 'triage'; main = taskPane('triage') }
  } else if (st === 'task') { sel = 'nightly'; main = taskPane('nightly') }
  else if (st === 'menu') { sel = 'weekly'; main = taskPane('weekly', true) }
  else if (st === 'waiting') { sel = 'triage'; main = taskPane('triage') }
  else if (st === 'preset') { sel = 'maps'; main = taskPane('maps') }
  else if (st === 'new') { sel = 'new'; main = newPane() }
  else if (st === 'history') { sel = 'history'; main = historyPane() }
  else if (st === 'empty') { main = promptPane(true) }
  if (narrow) {
    const listFirst = st === 'empty' || (st === 'start' && S.pane !== 'next')
    return `<div class="layout">${listFirst ? listPanel(sel) : `<section class="mp">${main}</section>`}</div>`
  }
  return `<div class="layout">${listPanel(sel)}<section class="mp">${main}</section></div>`
}

function paint() {
  const el = document.getElementById('spec')
  el.className = `spec ${S.appearance === 'light' ? 'light' : ''} ${S.width === 'narrow' ? 'narrow' : ''}`
  el.dataset.accent = S.accent
  el.style.width = S.width === 'narrow' ? '420px' : '1040px'
  el.innerHTML = render()
  const anchor = el.querySelector('[data-anchor]'), m = el.querySelector('.menu')
  if (anchor && m) {
    const a = anchor.getBoundingClientRect(), r = m.offsetParent.getBoundingClientRect()
    m.style.top = `${a.bottom - r.top + m.offsetParent.scrollTop + 4}px`
    m.style.left = `${Math.max(8, a.right - r.left - 232)}px`
  }
  document.querySelectorAll('.x-opt').forEach(b => b.setAttribute('aria-pressed', String(S[b.dataset.k] === b.dataset.v)))
}
document.querySelectorAll('.x-opt').forEach(b => b.addEventListener('click', () => { S[b.dataset.k] = b.dataset.v; paint() }))
paint()
</script>
</body>
</html>
