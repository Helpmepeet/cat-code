name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Isolate test state
        run: printf 'CLAUDE_CONFIG_DIR=%s/cat-code-ci-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install engine dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile
        working-directory: app

      - name: Check and build the engine
        run: bun run build:dev:full

      - name: Check desktop types
        run: bun run --cwd app typecheck

      - name: Check sidecar types
        run: bun run --cwd app typecheck:sidecar

      - name: Build the renderer
        run: bun run --cwd app renderer:build

      - name: Run all desktop tests
        run: bun run --cwd app test:all
